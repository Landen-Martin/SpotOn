<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">
<title>SpotOn — Web Player</title>
<style>
/* ============================================================
   BASE
   ============================================================ */
*,*::before,*::after{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:#000;color:#fff;overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;}
input{font:inherit;}
svg{display:block;fill:currentColor;}
::-webkit-scrollbar{width:12px;height:12px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16);border-radius:8px;border:3px solid transparent;background-clip:content-box;}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.3);background-clip:content-box;}
.hidden{display:none!important;}

:root{
  --bg:#000;
  --panel:#121212;
  --panel-2:#181818;
  --hover:#1f1f1f;
  --muted:#b3b3b3;
  --green:#1db954;
  --green-h:#1ed760;
  --danger:#f15e6c;
}

/* ============================================================
   APP GRID
   ============================================================ */
.app{
  height:100vh;
  display:grid;
  grid-template-columns:250px 1fr;
  grid-template-rows:1fr auto;
  grid-template-areas:
    "sidebar main"
    "player  player";
  gap:8px;
  padding:8px;
  padding-bottom:0;
}

/* ============================================================
   SIDEBAR
   ============================================================ */
.sidebar{
  grid-area:sidebar;
  background:var(--panel);
  border-radius:10px;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  min-height:0;
}
.brand{
  display:flex;align-items:center;gap:10px;
  padding:20px 20px 16px;
  font-weight:800;font-size:19px;letter-spacing:-.4px;
  flex-shrink:0;
}
.brand .logo{
  width:26px;height:26px;border-radius:50%;
  background:linear-gradient(135deg,var(--green-h),#0f8a3c);
  display:grid;place-items:center;flex-shrink:0;
}
.brand .logo svg{width:15px;height:15px;color:#000;}

.nav{padding:0 8px;flex-shrink:0;}
.nav-btn{
  display:flex;align-items:center;gap:14px;
  width:100%;padding:10px 12px;border-radius:6px;
  color:var(--muted);font-weight:700;font-size:14px;
  transition:color .15s,background .15s;
}
.nav-btn svg{width:22px;height:22px;flex-shrink:0;}
.nav-btn:hover{color:#fff;}
.nav-btn.active{color:#fff;}

.lib{
  margin-top:14px;
  flex:1;min-height:0;
  display:flex;flex-direction:column;
  padding:0 8px 8px;
}
.lib-head{
  display:flex;align-items:center;gap:8px;
  padding:8px 8px 8px 12px;color:var(--muted);
  font-weight:700;font-size:14px;
  flex-shrink:0;
}
.lib-head > svg{width:22px;height:22px;flex-shrink:0;}
.lib-head .spacer{flex:1;}
.lib-head .lib-btn{
  width:28px;height:28px;border-radius:50%;
  display:grid;place-items:center;color:var(--muted);
  transition:background .15s,color .15s,transform .12s;
  flex-shrink:0;
}
.lib-head .lib-btn:hover{background:#2a2a2a;color:#fff;transform:scale(1.08);}
.lib-head .lib-btn svg{width:16px;height:16px;}
.lib-head .lib-btn.danger:hover{color:var(--danger);}

.lib-list{overflow-y:auto;flex:1;min-height:0;padding-bottom:8px;}
.lib-item{
  display:flex;align-items:center;gap:12px;
  width:100%;padding:8px 12px;border-radius:6px;
  text-align:left;transition:background .15s;
}
.lib-item:hover{background:var(--hover);}
.lib-item.active{background:#2a2a2a;}
.lib-art{
  width:40px;height:40px;border-radius:5px;flex-shrink:0;
  display:grid;place-items:center;font-size:15px;
}
.lib-art.liked{background:linear-gradient(135deg,#450af5,#8e8ee5);color:#fff;}
.lib-art.liked svg{width:18px;height:18px;}
.lib-art svg{width:18px;height:18px;color:rgba(255,255,255,.35);}
.lib-meta{min-width:0;flex:1;}
.lib-title{
  font-size:14px;font-weight:600;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.lib-sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.lib-empty{
  padding:14px 12px;color:var(--muted);font-size:12px;line-height:1.6;
}
.lib-empty b{color:#e6e6e6;}
.lib-section{
  padding:14px 12px 6px;font-size:11px;
  text-transform:uppercase;letter-spacing:1px;color:#7a7a7a;
}

/* ============================================================
   MAIN
   ============================================================ */
.main{
  grid-area:main;
  background:var(--panel);
  border-radius:10px;
  overflow-y:auto;
  overflow-x:hidden;
  position:relative;
  min-height:0;
}
.topbar{
  position:sticky;top:0;z-index:30;
  display:flex;align-items:center;gap:12px;
  padding:14px 24px;
  background:rgba(18,18,18,.86);
  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);
}
.arrow-btn{
  width:32px;height:32px;border-radius:50%;
  background:rgba(0,0,0,.6);color:#fff;
  display:grid;place-items:center;flex-shrink:0;
  transition:transform .12s;
}
.arrow-btn svg{width:17px;height:17px;}
.arrow-btn:hover{transform:scale(1.06);}
.searchbox{
  flex:1;max-width:380px;position:relative;
}
.searchbox svg{
  position:absolute;left:12px;top:50%;transform:translateY(-50%);
  width:18px;height:18px;color:var(--muted);pointer-events:none;
}
#search{
  width:100%;padding:11px 14px 11px 40px;
  border-radius:500px;border:1px solid transparent;
  background:#242424;color:#fff;outline:none;font-size:14px;
  transition:background .15s,border-color .15s;
}
#search::placeholder{color:#9a9a9a;}
#search:hover{background:#2a2a2a;}
#search:focus{background:#2a2a2a;border-color:#555;}

.icon-btn{
  width:34px;height:34px;border-radius:50%;
  display:grid;place-items:center;color:var(--muted);
  background:rgba(0,0,0,.4);flex-shrink:0;
  transition:color .15s,background .15s,transform .12s;
}
.icon-btn svg{width:18px;height:18px;}
.icon-btn:hover{color:#fff;background:rgba(0,0,0,.7);transform:scale(1.06);}
.icon-btn.on{color:var(--green);}
.icon-btn.on:hover{color:var(--green-h);}
.icon-btn .spin{animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

.user-chip{
  margin-left:auto;width:34px;height:34px;border-radius:50%;
  background:linear-gradient(135deg,#1db954,#0d6b31);
  display:grid;place-items:center;font-weight:800;font-size:14px;color:#000;
  flex-shrink:0;cursor:pointer;border:2px solid rgba(0,0,0,.4);
}

/* ---------- STATUS BAR ---------- */
.status-bar{
  display:flex;align-items:center;gap:10px;
  margin:0 24px 4px;
  padding:8px 14px;border-radius:8px;
  font-size:12.5px;
  border:1px solid transparent;
}
.status-bar.ok{background:#1d3a25;color:#b6f0c8;border-color:rgba(29,185,84,.35);}
.status-bar.warn{background:#3a2e1d;color:#f0dcb6;border-color:rgba(185,146,29,.35);}
.status-bar.info{background:#1d2a3a;color:#b6d6f0;border-color:rgba(29,115,185,.35);}
.status-bar svg{width:15px;height:15px;flex-shrink:0;}
.status-bar .spacer{flex:1;}

/* ---------- HERO ---------- */
.hero{
  padding:34px 24px 22px;
  background:linear-gradient(180deg,rgba(29,185,84,.22),transparent);
  margin-top:-64px;padding-top:98px;
}
.hero h1{
  font-size:38px;font-weight:900;letter-spacing:-1.4px;margin:0 0 6px;
}
.hero p{margin:0;color:var(--muted);font-size:14px;}

/* ---------- SECTIONS ---------- */
.section{padding:0 24px 30px;}
.section-head{
  display:flex;align-items:flex-end;justify-content:space-between;
  margin-bottom:16px;gap:12px;
}
.section-head h2{
  font-size:24px;font-weight:800;letter-spacing:-.6px;margin:0;
}
.section-head .see-all{
  font-size:12px;font-weight:700;color:var(--muted);
  text-transform:uppercase;letter-spacing:.8px;white-space:nowrap;
}
.section-head .see-all:hover{text-decoration:underline;color:#fff;}

/* ---------- CARDS ---------- */
.cards{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(168px,1fr));
  gap:20px;
}
.card{
  background:#181818;
  border-radius:8px;
  padding:16px;
  cursor:pointer;
  position:relative;
  transition:background .25s;
}
.card:hover{background:#282828;}
.card-art{
  width:100%;aspect-ratio:1/1;border-radius:6px;
  margin-bottom:14px;
  box-shadow:0 8px 24px rgba(0,0,0,.5);
  display:grid;place-items:center;
  position:relative;overflow:hidden;
}
.card-art svg{width:34%;height:34%;color:rgba(255,255,255,.28);}
.card-title{
  font-size:15px;font-weight:700;margin-bottom:6px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.card-sub{
  font-size:13px;color:var(--muted);line-height:1.4;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden;
}
.card-play{
  position:absolute;right:24px;bottom:96px;
  width:48px;height:48px;border-radius:50%;
  background:var(--green);color:#000;
  display:grid;place-items:center;
  box-shadow:0 8px 16px rgba(0,0,0,.5);
  opacity:0;transform:translateY(8px);
  transition:opacity .2s,transform .2s,background .15s;
}
.card-play svg{width:22px;height:22px;}
.card:hover .card-play{opacity:1;transform:translateY(0);}
.card-play:hover{background:var(--green-h);transform:scale(1.05)!important;}

.card-create .card-art{
  background:#1f1f1f!important;
  border:1.5px dashed #3d3d3d;
  box-shadow:none;
}
.card-create .card-art svg{width:30%;height:30%;color:#6a6a6a;}
.card-create:hover .card-art{border-color:var(--green);}
.card-create:hover .card-art svg{color:var(--green);}

.card-badge{
  position:absolute;top:22px;left:22px;z-index:2;
  font-size:9.5px;font-weight:800;letter-spacing:1.2px;
  text-transform:uppercase;
  background:rgba(0,0,0,.55);color:var(--green-h);
  padding:4px 8px;border-radius:100px;
  backdrop-filter:blur(6px);
}

/* ---------- SONG LIST ---------- */
.songlist-head{
  display:grid;
  grid-template-columns:32px 44px 1fr 62px 34px 34px;
  gap:12px;
  padding:0 16px 8px;
  border-bottom:1px solid rgba(255,255,255,.1);
  margin-bottom:12px;
  color:var(--muted);font-size:12px;
  letter-spacing:1px;text-transform:uppercase;
}
.songlist-head .h-dur{text-align:right;}
.song{
  display:grid;
  grid-template-columns:32px 44px 1fr 62px 34px 34px;
  gap:12px;
  align-items:center;
  padding:8px 16px;
  border-radius:6px;
  cursor:pointer;
  user-select:none;
  transition:background .12s;
}
.song:hover{background:rgba(255,255,255,.09);}
.song.playing{background:rgba(255,255,255,.06);}
.s-num{
  display:grid;place-items:center;
  width:32px;height:32px;
  color:var(--muted);font-size:15px;font-variant-numeric:tabular-nums;
}
.s-num > *{grid-area:1/1;}
.s-num .num{transition:opacity .12s;}
.s-num .ic-play,.s-num .ic-pause,.s-num .eq{
  opacity:0;visibility:hidden;transition:opacity .12s;
}
.s-num svg{width:16px;height:16px;color:#fff;}
.song:hover .s-num .num{opacity:0;}
.song:hover .s-num .ic-play{opacity:1;visibility:visible;}
.song.playing .s-num .num{opacity:0;}
.song.playing:not(.paused) .s-num .eq{opacity:1;visibility:visible;}
.song.playing:not(.paused):hover .s-num .eq{opacity:0;visibility:hidden;}
.song.playing:not(.paused):hover .s-num .ic-pause{opacity:1;visibility:visible;}
.song.playing.paused .s-num .ic-play{opacity:1;visibility:visible;}
.song.playing.paused:hover .s-num .ic-play{opacity:1;visibility:visible;}
.song.playing .s-title{color:var(--green);}

.eq{display:flex;align-items:flex-end;gap:2px;height:15px;}
.eq i{
  width:3px;background:var(--green);border-radius:1px;
  animation:eq .9s ease-in-out infinite;
}
.eq i:nth-child(1){height:55%;animation-delay:-.5s;}
.eq i:nth-child(2){height:100%;animation-delay:-.2s;}
.eq i:nth-child(3){height:70%;animation-delay:-.7s;}
.eq i:nth-child(4){height:90%;animation-delay:-.35s;}
.paused .eq i{animation-play-state:paused;}
@keyframes eq{0%,100%{transform:scaleY(.35);}50%{transform:scaleY(1);}}

.s-art{
  width:44px;height:44px;border-radius:4px;
  display:grid;place-items:center;flex-shrink:0;
  box-shadow:0 2px 8px rgba(0,0,0,.4);
}
.s-art svg{width:18px;height:18px;color:rgba(255,255,255,.3);}
.s-meta{min-width:0;}
.s-title{
  font-size:15px;font-weight:500;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.s-artist{
  font-size:13px;color:var(--muted);margin-top:3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.s-dur{
  text-align:right;font-size:14px;color:var(--muted);
  font-variant-numeric:tabular-nums;
}
.s-like,.s-more{
  width:34px;height:34px;display:grid;place-items:center;
  color:var(--muted);opacity:0;
  transition:opacity .15s,color .15s,transform .12s;
  border-radius:50%;
}
.s-like svg,.s-more svg{width:17px;height:17px;}
.song:hover .s-like,.song:hover .s-more{opacity:1;}
.s-like:hover,.s-more:hover{color:#fff;transform:scale(1.1);background:rgba(255,255,255,.08);}
.s-like.on{opacity:1;color:var(--green);}

/* ---------- EMPTY ---------- */
.empty{
  text-align:center;padding:60px 20px;color:var(--muted);
  max-width:680px;margin:0 auto;
}
.empty h3{color:#fff;font-size:22px;margin:0 0 10px;}
.empty p{margin:0 0 10px;font-size:14px;line-height:1.7;}
.empty code{
  background:#242424;padding:2px 6px;border-radius:4px;
  font-size:12.5px;color:var(--green-h);
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
}
.empty .hint{
  text-align:left;display:inline-block;
  background:#181818;border:1px solid #262626;
  padding:16px 20px;border-radius:10px;margin-top:10px;
  font-size:13px;line-height:1.9;
  max-width:100%;
}
.empty .hint b{color:#fff;}
.empty .hint code{display:block;margin:8px 0;padding:10px 12px;background:#111;color:#9fe8b6;}

/* ============================================================
   PLAYER BAR
   ============================================================ */
.player{
  grid-area:player;
  background:var(--panel-2);
  border-radius:10px;
  margin-bottom:8px;
  height:88px;
  display:grid;
  grid-template-columns:minmax(180px,1fr) minmax(320px,2fr) minmax(180px,1fr);
  align-items:center;
  gap:16px;
  padding:0 16px;
}

.np{display:flex;align-items:center;gap:12px;min-width:0;}
.np-art{
  width:56px;height:56px;border-radius:6px;flex-shrink:0;
  display:grid;place-items:center;
  box-shadow:0 4px 12px rgba(0,0,0,.5);
  transition:transform .2s;
  background:#282828;
}
.np-art svg{width:22px;height:22px;color:rgba(255,255,255,.3);}
.np-art:hover{transform:scale(1.04);cursor:pointer;}
.np-meta{min-width:0;}
.np-title{
  font-size:14px;font-weight:600;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.np-artist{
  font-size:12px;color:var(--muted);margin-top:4px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.np-like{
  width:32px;height:32px;display:grid;place-items:center;
  color:var(--muted);flex-shrink:0;transition:color .15s,transform .12s;
  border-radius:50%;
}
.np-like svg{width:17px;height:17px;}
.np-like:hover{color:#fff;transform:scale(1.1);background:rgba(255,255,255,.08);}
.np-like.on{color:var(--green);}
.np-like:disabled{opacity:.35;cursor:default;}
.np-like:disabled:hover{color:var(--muted);transform:none;background:none;}

.center{display:flex;flex-direction:column;align-items:center;gap:8px;}
.controls{display:flex;align-items:center;gap:18px;}
.ctrl{
  color:var(--muted);display:grid;place-items:center;
  transition:color .15s,transform .12s;position:relative;
}
.ctrl svg{width:19px;height:19px;}
.ctrl:hover{color:#fff;transform:scale(1.07);}
.ctrl.on{color:var(--green);}
.ctrl.on:hover{color:var(--green-h);}
.ctrl.on::after{
  content:'';position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);
  width:4px;height:4px;border-radius:50%;background:var(--green);
}
#playBtn{
  width:36px;height:36px;border-radius:50%;
  background:#fff;color:#000;display:grid;place-items:center;
  transition:transform .12s;
}
#playBtn:hover{transform:scale(1.07);background:#fff;}
#playBtn svg{width:17px;height:17px;}

.progress{
  display:flex;align-items:center;gap:10px;
  width:100%;max-width:620px;
}
.time{
  font-size:11px;color:var(--muted);min-width:34px;
  font-variant-numeric:tabular-nums;
}
.time.right{text-align:right;}

.bar{
  flex:1;height:16px;display:flex;align-items:center;
  cursor:pointer;touch-action:none;
}
.bar-inner{
  position:relative;width:100%;height:4px;
  background:#4d4d4d;border-radius:2px;overflow:visible;
}
.fill{
  height:100%;width:0;background:#fff;border-radius:2px;
  position:relative;transition:background .15s;
}
.fill::after{
  content:'';position:absolute;right:-6px;top:50%;
  transform:translateY(-50%);
  width:12px;height:12px;border-radius:50%;
  background:#fff;opacity:0;transition:opacity .15s;
  box-shadow:0 1px 4px rgba(0,0,0,.5);
}
.bar:hover .fill{background:var(--green-h);}
.bar:hover .fill::after{opacity:1;}

.right{
  display:flex;align-items:center;justify-content:flex-end;gap:6px;
  min-width:0;
}
.right .ctrl svg{width:18px;height:18px;}
.vol-wrap{width:96px;}

/* ============================================================
   POPUP MENU
   ============================================================ */
.popup{
  position:fixed;z-index:400;
  background:#282828;border-radius:6px;
  padding:4px;min-width:220px;max-width:300px;
  box-shadow:0 12px 48px rgba(0,0,0,.75);
  animation:popIn .12s ease-out;
}
@keyframes popIn{from{opacity:0;transform:translateY(-4px);}to{opacity:1;transform:none;}}
.popup button{
  display:flex;align-items:center;gap:10px;
  width:100%;padding:10px 12px;border-radius:4px;
  text-align:left;color:#eee;font-size:14px;line-height:1.3;
}
.popup button:hover{background:#3e3e3e;}
.popup button .sub{margin-left:auto;color:var(--muted);font-size:12px;flex-shrink:0;}
.popup button .ico{width:16px;height:16px;flex-shrink:0;color:var(--muted);}
.popup button .ico svg{width:16px;height:16px;}
.popup button:hover .ico{color:#fff;}
.popup .sep{height:1px;background:rgba(255,255,255,.1);margin:4px 6px;}
.popup .label{
  padding:8px 12px 4px;font-size:11px;
  text-transform:uppercase;letter-spacing:.8px;color:#8a8a8a;
}
.popup .none{
  padding:6px 12px 10px;font-size:12.5px;color:var(--muted);
}

/* ============================================================
   MODAL
   ============================================================ */
.modal-back{
  position:fixed;inset:0;z-index:500;
  background:rgba(0,0,0,.7);
  display:grid;place-items:center;
  padding:20px;
  animation:fadeIn .15s ease-out;
}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
.modal{
  background:#1f1f1f;border-radius:12px;
  padding:26px 26px 22px;width:100%;max-width:420px;
  box-shadow:0 24px 80px rgba(0,0,0,.8);
  animation:popIn .18s ease-out;
}
.modal h3{margin:0 0 20px;font-size:22px;font-weight:800;letter-spacing:-.4px;}
.modal label{
  display:block;font-size:11.5px;font-weight:700;
  text-transform:uppercase;letter-spacing:.9px;
  color:var(--muted);margin-bottom:7px;
}
.modal input{
  width:100%;padding:12px 14px;border-radius:6px;
  background:#2a2a2a;border:1px solid #3a3a3a;
  color:#fff;outline:none;font-size:14px;margin-bottom:18px;
  transition:border-color .15s,background .15s;
}
.modal input:focus{border-color:#666;background:#2e2e2e;}
.modal input::placeholder{color:#7a7a7a;}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:4px;}
.btn{

/* ============================================================
   TOAST
   ============================================================ */
#toast{
  position:fixed;left:50%;bottom:112px;transform:translate(-50%,20px);
  background:#2a2a2a;color:#fff;
  padding:12px 20px;border-radius:8px;font-size:13px;
  box-shadow:0 10px 30px rgba(0,0,0,.6);
  opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;
  z-index:999;max-width:90vw;text-align:center;
}
#toast.show{opacity:1;transform:translate(-50%,0);}

   ============================================================ */

  .player{grid-template-columns:minmax(140px,1fr) minmax(260px,2fr) auto;}

}

}

<script>
"use strict";

/* ============================================================
   ⚠️  IMPORTANT — READ THIS FIRST
   ============================================================
   GitHub Pages does NOT provide directory listings.
   The ONLY way this app can find your songs is via a manifest
   file at:

       db/song/songs.json

   Make sure you've created that file with your filenames, e.g.:

       [
         "Guillermo del Toro - Pacific Rim Theme.mp3",
         "Pharrell Williams - Happy.mp3",
         "Three Days Grace - Gone Forever.mp3",
         "Three Days Grace - Time Of Dying.mp3"
       ]

   The filenames must match EXACTLY (case, spaces, extension).
   ============================================================ */

/* ============================================================
   1. CONFIG
   ============================================================ */
const CONFIG = {
  songDir: "db/song/",          // relative → works on GH Pages subpaths
  manifest: "songs.json",       // file inside songDir
  mediaCache: "spoton-media-v3",
  lsLikes: "spoton.likes",
  lsPlaylists: "spoton.playlists",
  lsPlays: "spoton.plays",
  lsOffline: "spoton.offline.savedAt",
  recencyWindow: 1000 * 60 * 60 * 24 * 14
};

const SONG_DIR = CONFIG.songDir;
const MANIFEST_URL = SONG_DIR + CONFIG.manifest;

/* ============================================================
   2. ICONS
   ============================================================ */
const ICON = {
  play:  '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>',
  pause: '<svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>',
  note:  '<svg viewBox="0 0 24 24"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg>',
  heart: '<svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>',
  heartO:'<svg viewBox="0 0 24 24"><path d="M16.5 3c-1.74 0-3.41.81-4.5 2.09C10.91 3.81 9.24 3 7.5 3 4.42 3 2 5.42 2 8.5c0 3.78 3.4 6.86 8.55 11.54L12 21.35l1.45-1.32C18.6 15.36 22 12.28 22 8.5 22 5.42 19.58 3 16.5 3zm-4.4 15.55l-.1.1-.1-.1C7.14 14.24 4 11.39 4 8.5 4 6.5 5.5 5 7.5 5c1.54 0 3.04.99 3.57 2.36h1.87C13.46 5.99 14.96 5 16.5 5c2 0 3.5 1.5 3.5 3.5 0 2.89-3.14 5.74-7.9 10.05z"/></svg>',
  plus:  '<svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>',
  trash: '<svg viewBox="0 0 24 24"><path d="M6 19a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>',
  dl:    '<svg viewBox="0 0 24 24"><path d="M5 20h14v-2H5v2zM19 9h-4V3H9v6H5l7 7 7-7z"/></svg>',
  more:  '<svg viewBox="0 0 24 24"><path d="M6 10a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm6 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm6 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4z"/></svg>',
  check: '<svg viewBox="0 0 24 24"><path d="M9 16.17 4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>',
  info:  '<svg viewBox="0 0 24 24"><path d="M11 7h2v2h-2zm0 4h2v6h-2zm1-9C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/></svg>',
  warn:  '<svg viewBox="0 0 24 24"><path d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/></svg>',
  cloud: '<svg viewBox="0 0 24 24"><path d="M19.35 10.04A7.49 7.49 0 0 0 12 4C9.11 4 6.6 5.64 5.35 8.04A5.994 5.994 0 0 0 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM17 13l-5 5-5-5h3V9h4v4h3z"/></svg>',
  spin:  '<svg class="spin" viewBox="0 0 24 24"><path d="M12 4V1L8 5l4 4V6a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z"/></svg>'
};

const REPEAT_ONE_PATH = "M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4zm-4-2V9h-1l-2 1v1h1.5v4H13z";

/* ============================================================
   3. STATE
   ============================================================ */
const state = {
  songs: [],
  currentList: [],
  queue: [],
  order: [],
  pos: -1,
  playing: false,
  shuffle: false,
  repeat: "off",
  liked: new Set(),
  plays: {},
  lastPlayed: {},
  playlists: [],
  volume: 0.8,
  lastVolume: 0.8,
  muted: false,
  view: "home",
  currentPlaylistId: null,
  currentMixId: null,
  history: [],
  historyIndex: -1,
  offlineSaved: false,
  savingOffline: false,
  manifestFound: false,
  loadError: null
};

const audio = new Audio();
audio.preload = "metadata";
audio.volume = state.volume;

/* ============================================================
   4. UTILITIES
   ============================================================ */
const $  = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];

const esc = s => String(s).replace(/[&<>"']/g, c => (
  { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
));

function hashStr(str) {
  let h = 0;
  for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) | 0;
  return Math.abs(h);
}

function coverStyle(song) {
  const h = hashStr((song.title || "") + "|" + (song.artist || ""));
  const a = h % 360;
  const b = (a + 55 + ((h >> 4) % 130)) % 360;
  return `background:linear-gradient(135deg,hsl(${a} 62% 44%),hsl(${b} 68% 20%))`;
}

function fmtTime(sec) {
  if (!isFinite(sec) || sec < 0) return "0:00";
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return m + ":" + String(s).padStart(2, "0");
}

const songKey = song => song.title + "::" + song.artist;
const fileKey = song => String(song.file || "").split("/").pop();

function songUrl(song) {
  let f = String(song.file || "");
  f = f.replace(/^\.?\//, "").replace(/^db\/song\//i, "");
  return SONG_DIR + f.split("/").map(encodeURIComponent).join("/");
}

function prettifyName(filename) {
  return decodeURIComponent(filename)
    .replace(/\.[^.]+$/, "")
    .replace(/[_-]+/g, " ")
    .replace(/\s+/g, " ")
    .trim()
    .replace(/\b\w/g, c => c.toUpperCase());
}

/** Try to pull "Artist - Title" from a filename */
function parseArtistTitle(filename, fallbackTitle) {
  const base = prettifyName(filename);
  const m = base.match(/^(.+?)\s+-\s+(.+)$/);
  if (m) return { artist: m[1].trim(), title: m[2].trim() };
  return { artist: "Unknown Artist", title: fallbackTitle || base };
}

function shuffleArray(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

const plural = (n, word) => n + " " + word + (n === 1 ? "" : "s");
const uid = prefix => prefix + "_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

let toastTimer = null;
function toast(msg, ms = 2600) {
  const el = $("#toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), ms);
}

/* ============================================================
   5. STORAGE
   ============================================================ */
function lsGet(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  } catch (e) { return fallback; }
}
function lsSet(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
}

function saveLikes()     { lsSet(CONFIG.lsLikes, [...state.liked]); }
function savePlays()     { lsSet(CONFIG.lsPlays, { plays: state.plays, lastPlayed: state.lastPlayed }); }
function savePlaylists() { lsSet(CONFIG.lsPlaylists, state.playlists); }

function loadPersisted() {
  lsGet(CONFIG.lsLikes, []).forEach(k => state.liked.add(k));
  const p = lsGet(CONFIG.lsPlays, { plays: {}, lastPlayed: {} });
  state.plays = p.plays || {};
  state.lastPlayed = p.lastPlayed || {};
  const rawPls = lsGet(CONFIG.lsPlaylists, []);
  state.playlists = Array.isArray(rawPls)
    ? rawPls.filter(p => p && typeof p === "object" && p.id && p.name).map(p => ({
        id: String(p.id),
        name: String(p.name).slice(0, 80),
        description: String(p.description || "").slice(0, 140),
        files: Array.isArray(p.files) ? p.files.filter(f => typeof f === "string") : [],
        createdAt: p.createdAt || Date.now()
      }))
    : [];
  state.offlineSaved = !!localStorage.getItem(CONFIG.lsOffline);
}

/* ============================================================
   6. LOADING SONGS
   ============================================================
   GitHub Pages has no directory listing → the manifest is
   REQUIRED. We try the manifest first. If it's missing, we
   surface a clear error rather than silently failing.
   ============================================================ */
async function loadSongs() {
  state.manifestFound = false;
  state.loadError = null;

  /* --- 1. Manifest (required for GitHub Pages) --- */
  try {
    const bust = MANIFEST_URL + "?v=" + Date.now();
    const res = await fetch(bust, { cache: "no-store" });

    if (res.ok) {
      const text = await res.text();
      let data;
      try { data = JSON.parse(text); }
      catch (e) {
        state.loadError = "manifest-parse";
        return [];
      }

      if (Array.isArray(data)) {
        state.manifestFound = true;
        if (!data.length) return [];
        return data.map(normalizeSong).filter(Boolean);
      }
      state.loadError = "manifest-shape";
      return [];
    } else if (res.status === 404) {
      state.loadError = "manifest-missing";
    } else {
      state.loadError = "manifest-http-" + res.status;
    }
  } catch (e) {
    state.loadError = "manifest-network";
  }

  /* --- 2. Directory listing (works only on local servers) --- */
  try {
    const res = await fetch(SONG_DIR + "?v=" + Date.now(), { cache: "no-store" });
    if (res.ok) {
      const ct = res.headers.get("content-type") || "";
      if (ct.includes("text/html")) {
        const html = await res.text();
        const doc = new DOMParser().parseFromString(html, "text/html");
        const files = [...doc.querySelectorAll("a")]
          .map(a => a.getAttribute("href"))
          .filter(h => h && /\.(mp3|m4a|ogg|wav|flac|aac)$/i.test(h))
          .map(h => decodeURIComponent(h.split("/").pop().split("?")[0]));
        if (files.length) {
          state.manifestFound = true;
          return files.map(f => {
            const info = parseArtistTitle(f);
            return {
              title: info.title,
              artist: info.artist,
              album: "",
              file: f,
              duration: null
            };
          });
        }
      }
    }
  } catch (e) { /* ignore */ }

  return [];
}

function normalizeSong(raw) {
  if (typeof raw === "string") {
    const info = parseArtistTitle(raw);
    return {
      title: info.title,
      artist: info.artist,
      album: "",
      file: raw,
      duration: null
    };
  }
  if (!raw || typeof raw !== "object") return null;
  const file = raw.file || raw.src || raw.url || "";
  if (!file) return null;
  const info = parseArtistTitle(file);
  return {
    title: raw.title || info.title,
    artist: raw.artist || raw.author || info.artist,
    album: raw.album || "",
    file,
    duration: typeof raw.duration === "number" ? raw.duration : null
  };
}

async function prefetchDurations() {
  for (const song of state.songs) {
    if (song.duration) continue;
    try {
      song.duration = await readDuration(songUrl(song));
      updateDurationUI(song);
    } catch (e) { /* skip */ }
  }
}

function readDuration(src) {
  return new Promise((resolve, reject) => {
    const a = new Audio();
    a.preload = "metadata";
    let settled = false;
    const done = ok => {
      if (settled) return;
      settled = true;
      a.removeEventListener("loadedmetadata", onLoad);
      a.removeEventListener("error", onErr);
      a.src = "";
      ok ? resolve(a.duration) : reject(new Error("load error"));
    };
    const onLoad = () => done(true);
    const onErr  = () => done(false);
    a.addEventListener("loadedmetadata", onLoad);
    a.addEventListener("error", onErr);
    a.src = src;
    setTimeout(() => done(false), 8000);
  });
}

function updateDurationUI(song) {
  const i = state.currentList.indexOf(song);
  if (i < 0) return;
  const el = document.querySelector(`#content .song[data-idx="${i}"] .s-dur`);

const getPlaylist = id => state.playlists.find(p => p.id === id) || null;

function createPlaylist(name, description = "") {
  const pl = {
    id: uid("pl"),
    name: (name || "New Playlist").trim().slice(0, 80) || "New Playlist",
    description: (description || "").trim().slice(0, 140),
    files: [],
    createdAt: Date.now()
  };
  state.playlists.unshift(pl);
  savePlaylists();
  return pl;
}

function deletePlaylist(id) {
  const i = state.playlists.findIndex(p => p.id === id);
  if (i < 0) return false;
  state.playlists.splice(i, 1);
  savePlaylists();
  if (state.currentPlaylistId === id) {
    state.currentPlaylistId = null;
    state.view = "home";
  }
  return true;
}

function addSongToPlaylist(id, song) {
  const pl = getPlaylist(id);
  if (!pl || !song) return false;
  const f = fileKey(song);
  if (!f || pl.files.includes(f)) return false;
  pl.files.push(f);
  savePlaylists();
  return true;
}

function removeSongFromPlaylist(id, song) {
  const pl = getPlaylist(id);
  if (!pl || !song) return false;
  const f = fileKey(song);
  const i = pl.files.indexOf(f);
  if (i < 0) return false;
  pl.files.splice(i, 1);
  savePlaylists();
  return true;
}

function resolvePlaylist(pl) {
  if (!pl) return [];
  const byFile = new Map();
  state.songs.forEach(s => byFile.set(fileKey(s).toLowerCase(), s));
  const out = [];
  const seen = new Set();
  for (const f of pl.files) {
    const s = byFile.get(String(f).toLowerCase());
    if (!s) continue;
    const k = songKey(s);
    if (seen.has(k)) continue;
    seen.add(k);
    out.push(s);
  }
  return out;
}

/* ============================================================
   8. THE ALGORITHM
   ============================================================
   Local-only recommender driven by:
     • play counts       • liked songs
     • artist affinity   • recency (14-day decay)
     • deterministic jitter for stable ordering
   ============================================================ */
function recordPlay(song) {
  if (!song) return;
  const f = fileKey(song);
  if (!f) return;
  state.plays[f] = (state.plays[f] || 0) + 1;
  state.lastPlayed[f] = Date.now();
  savePlays();
}

function buildScoredSongs() {
  const songs = state.songs;
  const now = Date.now();

  const affinity = {};
  songs.forEach(s => {
    const plays = state.plays[fileKey(s)] || 0;
    const liked = state.liked.has(songKey(s)) ? 1 : 0;
    affinity[s.artist] = (affinity[s.artist] || 0) + plays * 2 + liked * 3;
  });

  return songs.map(s => {
    const f = fileKey(s);
    const plays = state.plays[f] || 0;
    const liked = state.liked.has(songKey(s)) ? 1 : 0;
    const aff = affinity[s.artist] || 0;
    const ts = state.lastPlayed[f];
    const recency = ts ? Math.max(0, 1 - (now - ts) / CONFIG.recencyWindow) : 0;
    const jitter = (hashStr(f) % 1000) / 1000;

    const score =
      plays * 3 +
      liked * 6 +
      aff * 0.4 +
      recency * 4 +
      jitter * 0.6;

    return { song: s, score };
  }).sort((a, b) => b.score - a.score);
}

function hasTasteProfile() {
  return Object.keys(state.plays).length > 0 || state.liked.size > 0;
}

function generateMixes() {
  const songs = state.songs;
  if (!songs.length) return [];

  const mixes = [];
  const scored = buildScoredSongs();
  const hasHistory = hasTasteProfile();

  const onRepeat = songs
    .filter(s => (state.plays[fileKey(s)] || 0) >= 2)
    .sort((a, b) => (state.plays[fileKey(b)] || 0) - (state.plays[fileKey(a)] || 0))
    .slice(0, 20);
  if (onRepeat.length >= 3) {
    mixes.push({
      id: "mix-on-repeat",
      name: "On Repeat",
      description: "The songs you keep coming back to",
      list: onRepeat
    });
  }

  const madeForYou = scored.slice(0, Math.min(20, Math.max(8, songs.length))).map(x => x.song);
  if (madeForYou.length >= 3) {
    mixes.push({
      id: "mix-made-for-you",
      name: hasHistory ? "Made For You" : "Shuffle Mix",
      description: hasHistory
        ? "Built from what you listen to and like"
        : "Play a few songs and this adapts to you",
      list: madeForYou
    });
  }

  if (hasHistory) {
    const discover = songs
      .filter(s => !state.plays[fileKey(s)])
      .sort((a, b) => (hashStr(fileKey(a)) % 997) - (hashStr(fileKey(b)) % 997))
      .slice(0, 20);
    if (discover.length >= 3) {
      mixes.push({
        id: "mix-discover",
        name: "Discover",
        description: "Songs you haven't played yet",
        list: discover
      });
    }
  }

  if (hasHistory) {
    const affinity = {};
    songs.forEach(s => {
      const p = state.plays[fileKey(s)] || 0;
      const l = state.liked.has(songKey(s)) ? 1 : 0;
      affinity[s.artist] = (affinity[s.artist] || 0) + p * 2 + l * 3;
    });
    const top = Object.entries(affinity).sort((a, b) => b[1] - a[1])[0];
    if (top && top[1] > 0) {
      const list = songs.filter(s => s.artist === top[0]);
      if (list.length >= 3) {
        mixes.push({
          id: "mix-artist",
          name: top[0] + " Mix",
          description: "More from an artist you keep playing",
          list
        });
      }
    }
  }

  return mixes;
}

function buildRadio(song) {
  if (!song) return [];
  const seedHash = hashStr(song.artist);
  return state.songs
    .filter(s => s !== song)
    .map(s => {
      let sim = 0;
      if (s.artist === song.artist) sim += 10;
      if (s.album && s.album === song.album) sim += 5;
      sim += (hashStr(s.artist) % 7 === seedHash % 7) ? 2 : 0;
      sim += (hashStr(fileKey(s)) % 11 === hashStr(fileKey(song)) % 11) ? 1 : 0;
      sim += Math.random();
      return { s, sim };
    })
    .sort((a, b) => b.sim - a.sim)
    .slice(0, 30)
    .map(x => x.s);
}

/* ============================================================
   9. PLAYBACK
   ============================================================ */
const currentSong = () =>
  state.order.length && state.pos >= 0 && state.pos < state.order.length
    ? state.queue[state.order[state.pos]]
    : null;

function buildOrder(startIdx) {
  const n = state.queue.length;
  if (n === 0) { state.order = []; state.pos = -1; return; }
  if (state.shuffle) {
    const rest = [...Array(n).keys()].filter(i => i !== startIdx);
    shuffleArray(rest);
    state.order = [startIdx, ...rest];
    state.pos = 0;
  } else {
    state.order = [...Array(n).keys()];
    state.pos = startIdx;
  }
}

function playSong(song, context) {
  const list = (context && context.length ? context : state.songs).slice();
  let idx = list.indexOf(song);
  if (idx < 0) { list.unshift(song); idx = 0; }
  state.queue = list;
  buildOrder(idx);
  loadCurrent(true);
}

function playList(list, startIdx = 0) {
  if (!list || !list.length) return;
  state.queue = list.slice();
  buildOrder(Math.max(0, Math.min(startIdx, list.length - 1)));
  loadCurrent(true);
}

function loadCurrent(autoplay) {
  const song = currentSong();
  if (!song) return;

  audio.src = songUrl(song);
  updateNowPlaying();
  renderHighlight();

  if (autoplay) {
    audio.play().then(() => {
      recordPlay(song);
    }).catch(() => {
      setPlaying(false);
      const off = !navigator.onLine;
      toast(off
        ? 'Offline — "' + song.title + '" is not saved. Tap the cloud button to save for offline.'
        : 'Could not play "' + song.title + '". Check that the file exists in db/song/.');
    });
  }
}

function setPlaying(v) {
  state.playing = v;
  updatePlayIcon();
  renderHighlight();
  updateMediaSession();
}

function togglePlay() {
  const song = currentSong();
  if (!song) {
    if (state.songs.length) playSong(state.songs[0], state.songs);
    else toast("Your library is empty — add songs to db/song/");
    return;
  }
  if (audio.paused) audio.play().catch(() => toast("Playback failed."));
  else audio.pause();
}

function next(auto) {
  if (!state.order.length) return;
  if (auto && state.repeat === "one") {
    audio.currentTime = 0;
    audio.play().catch(() => {});
    return;
  }
  if (state.pos < state.order.length - 1) {
    state.pos++;
  } else if (state.repeat === "all") {
    buildOrder(state.order[0]);
    if (state.shuffle) state.pos = 0;
  } else {
    audio.pause();
    audio.currentTime = 0;
    setPlaying(false);
    return;
  }
  loadCurrent(true);
}

function prev() {
  if (!state.order.length) return;
  if (audio.currentTime > 3) { audio.currentTime = 0; return; }
  if (state.pos > 0) state.pos--;
  else if (state.repeat === "all") state.pos = state.order.length - 1;
  else audio.currentTime = 0;
  loadCurrent(true);
}

function makeBarDraggable(barEl, onRatio, onCommit) {
  let dragging = false;
  const ratioFromEvent = e => {
    const r = barEl.getBoundingClientRect();
    return Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
  };
  const move = e => { if (dragging) onRatio(ratioFromEvent(e), false); };
  const up = e => {
    if (!dragging) return;
    dragging = false;
    document.removeEventListener("pointermove", move);
    document.removeEventListener("pointerup", up);
    if (onCommit) onCommit(ratioFromEvent(e));
  };
  barEl.addEventListener("pointerdown", e => {
    e.preventDefault();
    dragging = true;
    onRatio(ratioFromEvent(e), true);
    document.addEventListener("pointermove", move);
    document.addEventListener("pointerup", up);
  });
}

function downloadSong(song) {
  if (!song) return;
  const url = songUrl(song);
  const name = fileKey(song) || "song.mp3";
  const a = document.createElement("a");
  a.href = url;
  a.download = name;
  a.rel = "noopener";
  document.body.appendChild(a);
  a.click();
  a.remove();
  toast('Downloading "' + song.title + '"');
}

/* ============================================================
   12. OFFLINE
   ============================================================ */
async function cacheStatus() {
  if (!("caches" in window) || !state.songs.length) return { saved: 0, total: 0 };
  try {
    const cache = await caches.open(CONFIG.mediaCache);
    let saved = 0;
    for (const s of state.songs) {
      const hit = await cache.match(songUrl(s));
      if (hit) saved++;
    }
    return { saved, total: state.songs.length };
  } catch (e) {
    return { saved: 0, total: state.songs.length };
  }
}

async function saveAllOffline() {
  if (state.savingOffline) return;
  if (!("caches" in window)) { toast("This browser can't cache files for offline use."); return; }
  if (!state.songs.length) { toast("Nothing to save — your library is empty."); return; }

  state.savingOffline = true;
  updateOfflineButton();

  let cache;
  try { cache = await caches.open(CONFIG.mediaCache); }
  catch (e) {
    state.savingOffline = false;
    updateOfflineButton();
    toast("Could not open the offline cache.");
    return;
  }

  const songs = state.songs;
  let done = 0, failed = 0;

  for (const song of songs) {
    const url = songUrl(song);
    try {
      const existing = await cache.match(url);
      if (!existing) {
        const res = await fetch(url, { cache: "no-store" });
        if (res.ok) await cache.put(url, res.clone());
        else failed++;
      }
    } catch (e) { failed++; }
    done++;
    if (done % 2 === 0 || done === songs.length) {
      toast(`Saving for offline… ${done}/${songs.length}`, 1200);
    }
  }

  state.savingOffline = false;

  if (failed === songs.length) {
    toast("Could not save anything. Are the files reachable?");
  } else {
    localStorage.setItem(CONFIG.lsOffline, String(Date.now()));
    state.offlineSaved = true;
    toast(failed
      ? `Saved ${songs.length - failed} of ${songs.length} songs for offline use.`
      : `All ${songs.length} songs are now available offline.`);
  }
  updateOfflineButton();
  renderStatusBar();
}

async function clearOfflineCache() {
  try {
    await caches.delete(CONFIG.mediaCache);
    localStorage.removeItem(CONFIG.lsOffline);
    state.offlineSaved = false;
    toast("Offline copies removed.");
  } catch (e) {
    toast("Could not clear the offline cache.");
  }
  updateOfflineButton();
  renderStatusBar();
}

function updateOfflineButton() {
  const btn = $("#offlineBtn");
  if (!btn) return;
  if (state.savingOffline) {
    btn.classList.add("on");
    btn.innerHTML = ICON.spin;
    btn.title = "Saving…";
  } else if (state.offlineSaved) {
    btn.classList.add("on");
    btn.innerHTML = ICON.check;
    btn.title = "Available offline — click to remove offline copies";
  } else {
    btn.classList.remove("on");
    btn.innerHTML = ICON.cloud;
    btn.title = "Save all songs for offline playback";
  }
}

/* ============================================================
   13. STATUS BAR  (helpful diagnostics on GH Pages)
   ============================================================ */
function renderStatusBar() {
  const bar = $("#statusBar");
  if (!bar) return;
  const isGH = location.hostname.endsWith("github.io");
  const msgs = [];

  if (!navigator.onLine) {
    msgs.push({
      cls: "info",
      icon: ICON.info,
      text: state.offlineSaved
        ? "You're offline. Saved songs will play normally."
        : "You're offline. Only the app shell is cached."
    });
  }

  if (state.loadError === "manifest-missing") {
    msgs.push({
      cls: "warn",
      icon: ICON.warn,
      text: `Manifest not found at ${MANIFEST_URL}. ` +
        (isGH
          ? "GitHub Pages can't list files, so songs.json is required."
          : "Create this file to load your songs.")
    });
  } else if (state.loadError && state.loadError.startsWith("manifest-parse")) {
    msgs.push({
      cls: "warn",
      icon: ICON.warn,
      text: `${MANIFEST_URL} isn't valid JSON. Check the syntax.`
    });
  } else if (state.loadError && state.loadError.startsWith("manifest-shape")) {
    msgs.push({
      cls: "warn",
      icon: ICON.warn,
      text: `${MANIFEST_URL} must be a JSON array of filenames or objects.`
    });
  } else if (state.loadError && state.loadError.startsWith("manifest-http")) {
    msgs.push({
      cls: "warn",
      icon: ICON.warn,
      text: `Could not load ${MANIFEST_URL} (${state.loadError}).`
    });
  } else if (!state.songs.length && state.manifestFound) {
    msgs.push({
      cls: "info",
      icon: ICON.info,
      text: `${MANIFEST_URL} exists but lists no songs. Add some filenames.`
    });
  } else if (state.offlineSaved && navigator.onLine) {
    msgs.push({
      cls: "ok",
      icon: ICON.check,
      text: "All songs are stored on this device — SpotOn will work without a connection."
    });
  }

  bar.innerHTML = msgs.map(m => `
    <div class="status-bar ${m.cls}">
      ${m.icon}
      <span>${m.text}</span>
      <span class="spacer"></span>
    </div>`).join("");
}

/* ============================================================
   14. RENDERING
   ============================================================ */
const content = $("#content");

function emptyLibraryHTML() {
  const isGH = location.hostname.endsWith("github.io");
  const noManifest = state.loadError === "manifest-missing";
  const badJSON = state.loadError === "manifest-parse";
  const badShape = state.loadError === "manifest-shape";
  const emptyManifest = state.manifestFound && !state.songs.length && !state.loadError;

  let body = "";

  if (noManifest) {
    body = `
      <p><b>Missing manifest.</b> ${isGH ? "GitHub Pages doesn't list files automatically — you must tell the app what's in your folder." : "Your local server also needs this file."}</p>
      <div class="hint">
        <b>Create <code>db/song/songs.json</code></b> and list your filenames:
        <code>[
  "Guillermo del Toro - Pacific Rim Theme.mp3",
  "Pharrell Williams - Happy.mp3",
  "Three Days Grace - Gone Forever.mp3",
  "Three Days Grace - Time Of Dying.mp3"
]</code>
        Names must match the files in <code>db/song/</code> exactly — including spaces and capital letters.
      </div>`;
  } else if (badJSON) {
    body = `
      <p><b>Invalid JSON.</b> The file <code>${MANIFEST_URL}</code> couldn't be parsed.</p>
      <div class="hint">
        Make sure it's an array, with commas between items and no trailing comma. Example:
        <code>["Song One.mp3", "Song Two.mp3"]</code>
      </div>`;
  } else if (badShape) {
    body = `
      <p><b>Unexpected format.</b> The file <code>${MANIFEST_URL}</code> must contain a JSON array.</p>
      <div class="hint">
        Either an array of filenames:
        <code>["Song One.mp3", "Song Two.mp3"]</code>
        Or an array of objects:
        <code>[{"file":"Song One.mp3","title":"Song One","artist":"Someone"}]</code>
      </div>`;
  } else if (emptyManifest) {
    body = `
      <p>The manifest <code>${MANIFEST_URL}</code> exists but contains no songs.</p>
      <div class="hint">
        Open it and add your filenames, then refresh.
      </div>`;
  } else {
    body = `
      <p>No songs were found. Add audio files to <code>db/song/</code> and list them in <code>${MANIFEST_URL}</code>.</p>`;
  }

  return `
    <div class="empty">
      <h3>No songs found</h3>
      ${body}
    </div>`;
}

/* ============================================================
   15. POPUP
   ============================================================ */
let popupEl = null;

function closePopup() {
  if (popupEl) { popupEl.remove(); popupEl = null; }
  document.removeEventListener("click", onDocClickForPopup, true);
  document.removeEventListener("keydown", onKeyForPopup, true);
  window.removeEventListener("resize", closePopup);
  window.removeEventListener("scroll", closePopup, true);
}
function onDocClickForPopup(e) {
  if (popupEl && !popupEl.contains(e.target)) closePopup();
}
function onKeyForPopup(e) {
  if (e.key === "Escape") { e.stopPropagation(); closePopup(); }
}

function showPopup(anchorEl, html, onPick) {
  closePopup();
  const el = document.createElement("div");
  el.className = "popup";
  el.innerHTML = html;
  document.body.appendChild(el);
  popupEl = el;

  const r = anchorEl.getBoundingClientRect();
  const pw = el.offsetWidth, ph = el.offsetHeight;
  let left = r.right - pw;
  let top = r.bottom + 6;
  if (left < 8) left = 8;
  if (left + pw > innerWidth - 8) left = innerWidth - pw - 8;
  if (top + ph > innerHeight - 8) top = Math.max(8, r.top - ph - 6);
  el.style.left = left + "px";
  el.style.top = top + "px";

  el.addEventListener("click", e => {
    const btn = e.target.closest("button[data-act]");
    if (!btn) return;
    e.stopPropagation();
    onPick(btn.dataset.act, btn.dataset.val || "");
  });

  setTimeout(() => document.addEventListener("click", onDocClickForPopup, true), 0);
  document.addEventListener("keydown", onKeyForPopup, true);
  window.addEventListener("resize", closePopup);
  window.addEventListener("scroll", closePopup, true);
}

      </div>
    </div>`;
  document.body.appendChild(back);

  const nameInput = $("#plName", back);
  const descInput = $("#plDesc", back);
  setTimeout(() => nameInput.focus(), 40);

  const close = () => { back.remove(); document.removeEventListener("keydown", onKey, true); };

  const commit = () => {
    const name = nameInput.value.trim();

    close();
    renderPlaylist(pl.id);
    renderLibrary();
    pushHistory(currentViewKey());
    toast(`Created "${pl.name}"`);
  };

  const onKey = e => {
    if (e.key === "Escape") { e.stopPropagation(); close(); }
    if (e.key === "Enter") { e.preventDefault(); commit(); }
  };
  document.addEventListener("keydown", onKey, true);

  back.addEventListener("click", e => {
    if (e.target === back) { close(); return; }
    const btn = e.target.closest("[data-modal]");
    if (!btn) return;
    if (btn.dataset.modal === "cancel") close();
    else commit();

function toggleLike(song) {
  if (!song) return;
  const key = songKey(song);
  const wasLiked = state.liked.has(key);
  if (wasLiked) state.liked.delete(key);
  else state.liked.add(key);

  saveLikes();
  renderLibrary();
  updateNowPlaying();

  const i = state.currentList.indexOf(song);
  if (i >= 0) {
    const btn = document.querySelector(`#content .song[data-idx="${i}"] .s-like`);
    if (btn) {
      const on = state.liked.has(key);
      btn.classList.toggle("on", on);
      btn.innerHTML = on ? ICON.heart : ICON.heartO;
    }
  }
}

/* ============================================================
   18. MEDIA SESSION
   ============================================================ */
function updateMediaSession() {
  if (!("mediaSession" in navigator)) return;
  const song = currentSong();
  if (!song) return;
  try {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: song.title,
      artist: song.artist,
      album: song.album || "SpotOn"
    });
    navigator.mediaSession.playbackState = state.playing ? "playing" : "paused";
  } catch (e) {}
}

/* ============================================================
   19. HISTORY
   ============================================================ */
function currentViewKey() {
  if (state.view === "playlist") return "playlist:" + state.currentPlaylistId;
  if (state.view === "mix") return "mix:" + state.currentMixId;
  return state.view;
}

function pushHistory(key) {
  if (state.history[state.historyIndex] === key) return;
  state.history = state.history.slice(0, state.historyIndex + 1);
  state.history.push(key);
  state.historyIndex = state.history.length - 1;
}

function restoreView(key) {
  if (!key) return;
  if (key.startsWith("playlist:")) renderPlaylist(key.slice(9));
  else if (key.startsWith("mix:")) renderMix(key.slice(4));
  else if (key === "home") renderHome();
  else if (key === "search") renderSearchView();
  else if (key === "liked") renderLiked();
  else if (key === "all") renderAllSongs();
  else renderHome();
  renderLibrary();
}

function goHistory(delta) {
  const n = state.historyIndex + delta;
  if (n < 0 || n >= state.history.length) return;
  state.historyIndex = n;
  restoreView(state.history[n]);
}

audio.addEventListener("play",  () => setPlaying(true));

audio.addEventListener("loadedmetadata", () => {
  updateProgress();
  const song = currentSong();
  if (song && !song.duration) {
    song.duration = audio.duration;
    updateDurationUI(song);
  }
});
audio.addEventListener("ended", () => next(true));

  const song = currentSong();
  if (!song) return;
  if (!navigator.onLine && state.offlineSaved) {
    toast(`"${song.title}" isn't saved offline.`);
  } else {
    toast('Cannot load "' + song.title + '" from db/song/');
  }
  setPlaying(false);
});

    const idx = state.queue.indexOf(song);
    buildOrder(idx < 0 ? 0 : idx);

  }
  toast(state.shuffle ? "Shuffle on" : "Shuffle off");
});

$("#repeatBtn").addEventListener("click", () => {
  state.repeat = state.repeat === "off" ? "all" : state.repeat === "all" ? "one" : "off";
  const btn = $("#repeatBtn");
  const icon = $("#repeatIcon");
  btn.classList.toggle("on", state.repeat !== "off");
  icon.innerHTML = state.repeat === "one"
    ? `<path d="${REPEAT_ONE_PATH}"/>`
    : '<path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/>';
  toast(state.repeat === "off" ? "Repeat off" : state.repeat === "all" ? "Repeat all" : "Repeat one");
});

$("#muteBtn").addEventListener("click", () => {
  if (state.muted || state.volume === 0) {
    state.muted = false;
    state.volume = state.lastVolume || 0.8;
  } else {
    state.lastVolume = state.volume;
    state.muted = true;
  }
  audio.volume = state.muted ? 0 : state.volume;
  updateVolumeUI();
});

makeBarDraggable(
  $("#seekBar"),
  ratio => {
    $("#seekFill").style.width = (ratio * 100) + "%";
    $("#curTime").textContent = fmtTime(ratio * (audio.duration || 0));

  }
);

makeBarDraggable(
  $("#volBar"),

    $("#volFill").style.width = (ratio * 100) + "%";
  },
  () => updateVolumeUI()
);

$("#offlineBtn").addEventListener("click", async () => {
  if (state.savingOffline) return;
  if (state.offlineSaved) {
    if (confirm("Remove the offline copies of your songs from this device?")) {
      await clearOfflineCache();
    }
  } else {
    await saveAllOffline();
  }
});

$("#newPlaylistBtn").addEventListener("click", openCreatePlaylistModal);

$("#deletePlaylistBtn").addEventListener("click", e => {
  e.stopPropagation();
  if (!state.playlists.length) { toast("No playlists to delete."); return; }

  const html =
    `<div class="label">Delete a playlist</div>` +
    state.playlists.map(pl => `
      <button data-act="del" data-val="${esc(pl.id)}">
        <span class="ico">${ICON.trash}</span>
        <span>${esc(pl.name)}</span>
        <span class="sub">Delete</span>
      </button>`).join("");

  showPopup(e.currentTarget, html, (act, val) => {
    if (act !== "del") return;
    const pl = getPlaylist(val);
    if (!pl) return;
    if (confirm(`Delete the playlist "${pl.name}"?\n\nThis only removes the playlist — your song files stay in db/song/.`)) {
      deletePlaylist(val);
      savePlaylists();
      renderLibrary();
      if (state.view === "playlist") renderHome();
      toast(`Deleted "${pl.name}"`);
    }
  });
});

$$(".nav-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    $$(".nav-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    const v = btn.dataset.view;
    if (v === "home") renderHome();
    else if (v === "search") { renderSearchView(); $("#search").focus(); }
    renderLibrary();
    pushHistory(currentViewKey());
  });
});

$("#libList").addEventListener("click", e => {
  const item = e.target.closest("[data-lib],[data-playlist]");
  if (!item) return;

  if (item.dataset.lib === "liked") renderLiked();
  else if (item.dataset.lib === "all") renderAllSongs();
  else if (item.dataset.playlist) renderPlaylist(item.dataset.playlist);

  renderLibrary();
  pushHistory(currentViewKey());
});

content.addEventListener("click", e => {

  const likeBtn = e.target.closest("[data-like]");
  if (likeBtn) {
    e.stopPropagation();
    toggleLike(state.currentList[Number(likeBtn.dataset.like)]);
    return;
  }

  const moreBtn = e.target.closest("[data-more]");
  if (moreBtn) {
    e.stopPropagation();
    const song = state.currentList[Number(moreBtn.dataset.more)];
    if (!song) return;

    showPopup(moreBtn, songMenuHTML(song), (act, val) => {
      if (act === "like") toggleLike(song);
      else if (act === "download") downloadSong(song);
      else if (act === "radio") {
        const radio = [song, ...buildRadio(song)];
        if (radio.length) { playList(radio, 0); toast(`Radio started from "${song.title}"`); }
      }
      else if (act === "addpl") {
        const pl = getPlaylist(val);
        if (!pl) return;
        if (pl.files.includes(fileKey(song))) {
          removeSongFromPlaylist(val, song);
          toast(`Removed from "${pl.name}"`);
        } else {
          addSongToPlaylist(val, song);
          toast(`Added to "${pl.name}"`);
        }
        renderLibrary();
        if (state.view === "playlist" && state.currentPlaylistId === val) renderPlaylist(val);
      }
      else if (act === "newpl") openCreatePlaylistModal();
    });
    return;
  }

  const createEl = e.target.closest("[data-createpl]");
  if (createEl) { e.stopPropagation(); openCreatePlaylistModal(); return; }

  const addSongs = e.target.closest("[data-addsongs]");
  if (addSongs) {
    e.stopPropagation();
    openAddSongsModal(addSongs.dataset.addsongs);
    return;
  }

  const delPl = e.target.closest("[data-deletepl]");
  if (delPl) {
    e.stopPropagation();
    const pl = getPlaylist(delPl.dataset.deletepl);
    if (!pl) return;
    if (confirm(`Delete the playlist "${pl.name}"?\n\nYour song files stay in db/song/.`)) {
      deletePlaylist(pl.id);
      renderLibrary();
      renderHome();
      pushHistory("home");
      toast(`Deleted "${pl.name}"`);
    }
    return;
  }

  const plPlay = e.target.closest("[data-playlistplay]");
  if (plPlay) {
    e.stopPropagation();
    const pl = getPlaylist(plPlay.dataset.playlistplay);
    const list = resolvePlaylist(pl);
    if (list.length) playList(list, 0);
    else toast("That playlist is empty.");
    return;
  }

  const mixPlay = e.target.closest("[data-mixplay]");
  if (mixPlay) {
    e.stopPropagation();
    const mix = generateMixes().find(m => m.id === mixPlay.dataset.mixplay);
    if (mix && mix.list.length) playList(mix.list, 0);
    return;
  }

  const plHeaderPlay = e.target.closest("[data-playplaylist]");
  if (plHeaderPlay) {
    e.stopPropagation();
    const list = resolvePlaylist(getPlaylist(plHeaderPlay.dataset.playplaylist));
    if (list.length) playList(list, 0);
    return;
  }

  const mixHeaderPlay = e.target.closest("[data-playmix]");
  if (mixHeaderPlay) {
    e.stopPropagation();
    const mix = generateMixes().find(m => m.id === mixHeaderPlay.dataset.playmix);
    if (mix && mix.list.length) playList(mix.list, 0);
    return;
  }

  const plCard = e.target.closest("[data-playlist]");
  if (plCard) {
    renderPlaylist(plCard.dataset.playlist);
    renderLibrary();
    pushHistory(currentViewKey());
    return;
  }

  const mixCard = e.target.closest("[data-mix]");
  if (mixCard) {
    renderMix(mixCard.dataset.mix);
    renderLibrary();
    pushHistory(currentViewKey());
    return;
  }

  const playAll = e.target.closest("[data-playall]");
  if (playAll) {
    if (state.songs.length) playList(state.songs, 0);
    return;
  }

  const row = e.target.closest(".song");
  if (row) {
    const i = Number(row.dataset.idx);
    const song = state.currentList[i];
    if (!song) return;
    if (song === currentSong()) togglePlay();
    else playSong(song, state.currentList);
    renderHighlight();
  }
});

const searchInput = $("#search");
let searchTimer = null;

searchInput.addEventListener("input", () => {
  clearTimeout(searchTimer);
  const q = searchInput.value;
  searchTimer = setTimeout(() => {
    if (!q.trim()) {
      renderSearchView();
      renderLibrary();
    } else {
      renderResults(q);
      $$(".nav-btn").forEach(b => b.classList.toggle("active", b.dataset.view === "search"));
      pushHistory("search");
    }
  }, 130);
});

searchInput.addEventListener("keydown", e => {
  if (e.key === "Escape") {
    searchInput.value = "";
    searchInput.blur();
    renderHome();
    renderLibrary();
    pushHistory("home");
  }
});

$("#backBtn").addEventListener("click", () => goHistory(-1));
$("#fwdBtn").addEventListener("click",  () => goHistory(1));

document.addEventListener("keydown", e => {
  const tag = (e.target.tagName || "").toLowerCase();
  if (tag === "input" || tag === "textarea") return;

  switch (e.key) {
    case " ": e.preventDefault(); togglePlay(); break;
    case "ArrowRight":
      if (e.shiftKey) next(false);
      else if (isFinite(audio.duration)) audio.currentTime = Math.min(audio.duration, audio.currentTime + 5);
      break;
    case "ArrowLeft":
      if (e.shiftKey) prev();
      else audio.currentTime = Math.max(0, audio.currentTime - 5);
      break;
    case "ArrowUp":
      e.preventDefault();
      state.muted = false;
      state.volume = Math.min(1, state.volume + 0.05);
      audio.volume = state.volume;
      updateVolumeUI();
      break;
    case "ArrowDown":
      e.preventDefault();
      state.volume = Math.max(0, state.volume - 0.05);
      audio.volume = state.volume;
      updateVolumeUI();
      break;
    case "m": $("#muteBtn").click(); break;
    case "s": $("#shuffleBtn").click(); break;
    case "r": $("#repeatBtn").click(); break;
    case "d": if (currentSong()) downloadSong(currentSong()); break;
    case "/": e.preventDefault(); searchInput.focus(); break;
  }
});

window.addEventListener("online",  () => { renderStatusBar(); toast("Back online"); });
window.addEventListener("offline", () => { renderStatusBar(); toast("You're offline"); });

/* ============================================================
   22. SERVICE WORKER (optional — app-shell caching)
   ============================================================ */
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(() => {});
  });
}

/* ============================================================
   23. INIT
   ============================================================ */
async function init() {
  loadPersisted();

  state.songs = await loadSongs();
  state.currentList = state.songs;

  renderHome();
  renderLibrary();
  renderStatusBar();
  updateVolumeUI();
  updatePlayIcon();
  updateNowPlaying();
  updateProgress();
  updateOfflineButton();

  state.history = ["home"];
  state.historyIndex = 0;

  prefetchDurations();

  if (!state.songs.length) {
    if (state.loadError === "manifest-missing") {
      toast("Missing db/song/songs.json — see the message on the page.", 5000);
    } else if (state.loadError) {
      toast("Could not load your library — see the message on the page.", 5000);
    } else {
      toast("No songs found — add files to db/song/.", 4000);
    }
  }

  setTimeout(async () => {
    if (!state.offlineSaved) return;
    const { saved, total } = await cacheStatus();
    if (total && saved < total) {
      state.offlineSaved = false;
      localStorage.removeItem(CONFIG.lsOffline);
      updateOfflineButton();
      renderStatusBar();
    }
  }, 1500);
}

init();
</script>
