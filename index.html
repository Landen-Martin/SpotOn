<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SpotOn — Web Player</title>
<style>
/* ============================================================
   BASE
   ============================================================ */
*,*::before,*::after{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:#000;color:#fff;overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;}
input{font:inherit;}
svg{display:block;fill:currentColor;}
::-webkit-scrollbar{width:12px;height:12px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16);border-radius:8px;border:3px solid transparent;background-clip:content-box;}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.3);background-clip:content-box;}
.hidden{display:none!important;}

:root{
  --bg:#000;
  --panel:#121212;
  --panel-2:#181818;
  --hover:#1f1f1f;
  --muted:#b3b3b3;
  --green:#1db954;
  --green-h:#1ed760;
}

/* ============================================================
   APP GRID
   ============================================================ */
.app{
  height:100vh;
  display:grid;
  grid-template-columns:250px 1fr;
  grid-template-rows:1fr auto;
  grid-template-areas:
    "sidebar main"
    "player  player";
  gap:8px;
  padding:8px;
  padding-bottom:0;
}

/* ============================================================
   SIDEBAR
   ============================================================ */
.sidebar{
  grid-area:sidebar;
  background:var(--panel);
  border-radius:10px;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  min-height:0;
}
.brand{
  display:flex;align-items:center;gap:10px;
  padding:20px 20px 16px;
  font-weight:800;font-size:19px;letter-spacing:-.4px;
  flex-shrink:0;
}
.brand .logo{
  width:26px;height:26px;border-radius:50%;
  background:linear-gradient(135deg,var(--green-h),#0f8a3c);
  display:grid;place-items:center;flex-shrink:0;
}
.brand .logo svg{width:15px;height:15px;color:#000;}

.nav{padding:0 8px;flex-shrink:0;}
.nav-btn{
  display:flex;align-items:center;gap:14px;
  width:100%;padding:10px 12px;border-radius:6px;
  color:var(--muted);font-weight:700;font-size:14px;
  transition:color .15s,background .15s;
}
.nav-btn svg{width:22px;height:22px;flex-shrink:0;}
.nav-btn:hover{color:#fff;}
.nav-btn.active{color:#fff;}

.lib{
  margin-top:14px;
  flex:1;min-height:0;
  display:flex;flex-direction:column;
  padding:0 8px 8px;
}
.lib-head{
  display:flex;align-items:center;gap:10px;
  padding:8px 12px;color:var(--muted);
  font-weight:700;font-size:14px;
  flex-shrink:0;
}
.lib-head svg{width:22px;height:22px;}
.lib-list{overflow-y:auto;flex:1;min-height:0;padding-bottom:8px;}
.lib-item{
  display:flex;align-items:center;gap:12px;
  width:100%;padding:8px 12px;border-radius:6px;
  text-align:left;transition:background .15s;
}
.lib-item:hover{background:var(--hover);}
.lib-item.active{background:#2a2a2a;}
.lib-art{
  width:40px;height:40px;border-radius:5px;flex-shrink:0;
  display:grid;place-items:center;font-size:15px;
}
.lib-art.liked{background:linear-gradient(135deg,#450af5,#8e8ee5);color:#fff;}
.lib-art.liked svg{width:18px;height:18px;}
.lib-art svg{width:18px;height:18px;color:rgba(255,255,255,.35);}
.lib-meta{min-width:0;}
.lib-title{
  font-size:14px;font-weight:600;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.lib-sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.lib-empty{
  padding:14px 12px;color:var(--muted);font-size:12px;line-height:1.5;
}

/* ============================================================
   MAIN
   ============================================================ */
.main{
  grid-area:main;
  background:var(--panel);
  border-radius:10px;
  overflow-y:auto;
  overflow-x:hidden;
  position:relative;
  min-height:0;
}
.topbar{
  position:sticky;top:0;z-index:30;
  display:flex;align-items:center;gap:16px;
  padding:14px 24px;
  background:rgba(18,18,18,.86);
  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);
}
.arrow-btn{
  width:32px;height:32px;border-radius:50%;
  background:rgba(0,0,0,.6);color:#fff;
  display:grid;place-items:center;flex-shrink:0;
  transition:transform .12s;
}
.arrow-btn svg{width:17px;height:17px;}
.arrow-btn:hover{transform:scale(1.06);}
.searchbox{
  flex:1;max-width:380px;position:relative;
}
.searchbox svg{
  position:absolute;left:12px;top:50%;transform:translateY(-50%);
  width:18px;height:18px;color:var(--muted);pointer-events:none;
}
#search{
  width:100%;padding:11px 14px 11px 40px;
  border-radius:500px;border:1px solid transparent;
  background:#242424;color:#fff;outline:none;font-size:14px;
  transition:background .15s,border-color .15s;
}
#search::placeholder{color:#9a9a9a;}
#search:hover{background:#2a2a2a;}
#search:focus{background:#2a2a2a;border-color:#555;}
.user-chip{
  margin-left:auto;width:34px;height:34px;border-radius:50%;
  background:linear-gradient(135deg,#1db954,#0d6b31);
  display:grid;place-items:center;font-weight:800;font-size:14px;color:#000;
  flex-shrink:0;cursor:pointer;border:2px solid rgba(0,0,0,.4);
}

/* ---------- HERO ---------- */
.hero{
  padding:34px 24px 22px;
  background:linear-gradient(180deg,rgba(29,185,84,.22),transparent);
  margin-top:-64px;padding-top:98px;
}
.hero h1{
  font-size:38px;font-weight:900;letter-spacing:-1.4px;margin:0 0 6px;
}
.hero p{margin:0;color:var(--muted);font-size:14px;}

/* ---------- SECTIONS ---------- */
.section{padding:0 24px 30px;}
.section-head{
  display:flex;align-items:flex-end;justify-content:space-between;
  margin-bottom:16px;
}
.section-head h2{
  font-size:24px;font-weight:800;letter-spacing:-.6px;margin:0;
}
.section-head .see-all{
  font-size:12px;font-weight:700;color:var(--muted);
  text-transform:uppercase;letter-spacing:.8px;
}
.section-head .see-all:hover{text-decoration:underline;color:#fff;}

/* ---------- CARDS ---------- */
.cards{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(168px,1fr));
  gap:20px;
}
.card{
  background:#181818;
  border-radius:8px;
  padding:16px;
  cursor:pointer;
  position:relative;
  transition:background .25s;
}
.card:hover{background:#282828;}
.card-art{
  width:100%;aspect-ratio:1/1;border-radius:6px;
  margin-bottom:14px;
  box-shadow:0 8px 24px rgba(0,0,0,.5);
  display:grid;place-items:center;
  position:relative;overflow:hidden;
}
.card-art svg{width:34%;height:34%;color:rgba(255,255,255,.28);}
.card-title{
  font-size:15px;font-weight:700;margin-bottom:6px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.card-sub{
  font-size:13px;color:var(--muted);line-height:1.4;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden;
}
.card-play{
  position:absolute;right:24px;bottom:96px;
  width:48px;height:48px;border-radius:50%;
  background:var(--green);color:#000;
  display:grid;place-items:center;
  box-shadow:0 8px 16px rgba(0,0,0,.5);
  opacity:0;transform:translateY(8px);
  transition:opacity .2s,transform .2s,background .15s;
}
.card-play svg{width:22px;height:22px;}
.card:hover .card-play{opacity:1;transform:translateY(0);}
.card-play:hover{background:var(--green-h);transform:scale(1.05)!important;}

/* ---------- SONG LIST ---------- */
.songlist-head{
  display:grid;
  grid-template-columns:32px 44px 1fr 62px 34px;
  gap:16px;
  padding:0 16px 8px;
  border-bottom:1px solid rgba(255,255,255,.1);
  margin-bottom:12px;
  color:var(--muted);font-size:12px;
  letter-spacing:1px;text-transform:uppercase;
}
.songlist-head .h-dur{text-align:right;}
.song{
  display:grid;
  grid-template-columns:32px 44px 1fr 62px 34px;
  gap:16px;
  align-items:center;
  padding:8px 16px;
  border-radius:6px;
  cursor:pointer;
  user-select:none;
  transition:background .12s;
}
.song:hover{background:rgba(255,255,255,.09);}
.song.playing{background:rgba(255,255,255,.06);}
.s-num{
  display:grid;place-items:center;
  width:32px;height:32px;
  color:var(--muted);font-size:15px;font-variant-numeric:tabular-nums;
}
.s-num > *{grid-area:1/1;}
.s-num .num{transition:opacity .12s;}
.s-num .ic-play,.s-num .ic-pause,.s-num .eq{
  opacity:0;visibility:hidden;transition:opacity .12s;
}
.s-num svg{width:16px;height:16px;color:#fff;}
.song:hover .s-num .num{opacity:0;}
.song:hover .s-num .ic-play{opacity:1;visibility:visible;}
.song.playing .s-num .num{opacity:0;}
.song.playing:not(.paused) .s-num .eq{opacity:1;visibility:visible;}
.song.playing:not(.paused):hover .s-num .eq{opacity:0;visibility:hidden;}
.song.playing:not(.paused):hover .s-num .ic-pause{opacity:1;visibility:visible;}
.song.playing.paused .s-num .ic-play{opacity:1;visibility:visible;}
.song.playing.paused:hover .s-num .ic-play{opacity:1;visibility:visible;}
.song.playing .s-title{color:var(--green);}

.eq{display:flex;align-items:flex-end;gap:2px;height:15px;}
.eq i{
  width:3px;background:var(--green);border-radius:1px;
  animation:eq .9s ease-in-out infinite;
}
.eq i:nth-child(1){height:55%;animation-delay:-.5s;}
.eq i:nth-child(2){height:100%;animation-delay:-.2s;}
.eq i:nth-child(3){height:70%;animation-delay:-.7s;}
.eq i:nth-child(4){height:90%;animation-delay:-.35s;}
.paused .eq i{animation-play-state:paused;}
@keyframes eq{0%,100%{transform:scaleY(.35);}50%{transform:scaleY(1);}}

.s-art{
  width:44px;height:44px;border-radius:4px;
  display:grid;place-items:center;flex-shrink:0;
  box-shadow:0 2px 8px rgba(0,0,0,.4);
}
.s-art svg{width:18px;height:18px;color:rgba(255,255,255,.3);}
.s-meta{min-width:0;}
.s-title{
  font-size:15px;font-weight:500;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.s-artist{
  font-size:13px;color:var(--muted);margin-top:3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.s-dur{
  text-align:right;font-size:14px;color:var(--muted);
  font-variant-numeric:tabular-nums;
}
.s-like{
  width:34px;height:34px;display:grid;place-items:center;
  color:var(--muted);opacity:0;transition:opacity .15s,color .15s,transform .12s;
}
.s-like svg{width:17px;height:17px;}
.song:hover .s-like{opacity:1;}
.s-like:hover{color:#fff;transform:scale(1.1);}
.s-like.on{opacity:1;color:var(--green);}

/* ---------- EMPTY ---------- */
.empty{
  text-align:center;padding:70px 20px;color:var(--muted);
}
.empty h3{color:#fff;font-size:22px;margin:0 0 8px;}
.empty p{margin:0;font-size:14px;line-height:1.6;}
.empty code{
  background:#242424;padding:2px 6px;border-radius:4px;
  font-size:13px;color:var(--green-h);
}

/* ============================================================
   PLAYER BAR
   ============================================================ */
.player{
  grid-area:player;
  background:var(--panel-2);
  border-radius:10px;
  margin-bottom:8px;
  height:88px;
  display:grid;
  grid-template-columns:minmax(180px,1fr) minmax(320px,2fr) minmax(180px,1fr);
  align-items:center;
  gap:16px;
  padding:0 16px;
}

/* now playing */
.np{display:flex;align-items:center;gap:12px;min-width:0;}
.np-art{
  width:56px;height:56px;border-radius:6px;flex-shrink:0;
  display:grid;place-items:center;
  box-shadow:0 4px 12px rgba(0,0,0,.5);
  transition:transform .2s;
  background:#282828;
}
.np-art svg{width:22px;height:22px;color:rgba(255,255,255,.3);}
.np-art:hover{transform:scale(1.04);cursor:pointer;}
.np-meta{min-width:0;}
.np-title{
  font-size:14px;font-weight:600;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.np-artist{
  font-size:12px;color:var(--muted);margin-top:4px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.np-like{
  width:32px;height:32px;display:grid;place-items:center;
  color:var(--muted);flex-shrink:0;transition:color .15s,transform .12s;
}
.np-like svg{width:17px;height:17px;}
.np-like:hover{color:#fff;transform:scale(1.1);}
.np-like.on{color:var(--green);}

/* center controls */
.center{display:flex;flex-direction:column;align-items:center;gap:8px;}
.controls{display:flex;align-items:center;gap:18px;}
.ctrl{
  color:var(--muted);display:grid;place-items:center;
  transition:color .15s,transform .12s;position:relative;
}
.ctrl svg{width:19px;height:19px;}
.ctrl:hover{color:#fff;transform:scale(1.07);}
.ctrl.on{color:var(--green);}
.ctrl.on:hover{color:var(--green-h);}
.ctrl.on::after{
  content:'';position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);
  width:4px;height:4px;border-radius:50%;background:var(--green);
}
#playBtn{
  width:36px;height:36px;border-radius:50%;
  background:#fff;color:#000;display:grid;place-items:center;
  transition:transform .12s;
}
#playBtn:hover{transform:scale(1.07);background:#fff;}
#playBtn svg{width:17px;height:17px;}

/* progress */
.progress{
  display:flex;align-items:center;gap:10px;
  width:100%;max-width:620px;
}
.time{
  font-size:11px;color:var(--muted);min-width:34px;
  font-variant-numeric:tabular-nums;
}
.time.right{text-align:right;}

.bar{
  flex:1;height:16px;display:flex;align-items:center;
  cursor:pointer;touch-action:none;
}
.bar-inner{
  position:relative;width:100%;height:4px;
  background:#4d4d4d;border-radius:2px;overflow:visible;
}
.fill{
  height:100%;width:0;background:#fff;border-radius:2px;
  position:relative;transition:background .15s;
}
.fill::after{
  content:'';position:absolute;right:-6px;top:50%;
  transform:translateY(-50%);
  width:12px;height:12px;border-radius:50%;
  background:#fff;opacity:0;transition:opacity .15s;
  box-shadow:0 1px 4px rgba(0,0,0,.5);
}
.bar:hover .fill{background:var(--green-h);}
.bar:hover .fill::after{opacity:1;}

/* right side */
.right{
  display:flex;align-items:center;justify-content:flex-end;gap:6px;
  min-width:0;
}
.right .ctrl svg{width:18px;height:18px;}
.vol-wrap{width:96px;}

/* ============================================================
   TOAST
   ============================================================ */
#toast{
  position:fixed;left:50%;bottom:112px;transform:translate(-50%,20px);
  background:#2a2a2a;color:#fff;
  padding:12px 20px;border-radius:8px;font-size:13px;
  box-shadow:0 10px 30px rgba(0,0,0,.6);
  opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;
  z-index:999;max-width:90vw;text-align:center;
}
#toast.show{opacity:1;transform:translate(-50%,0);}

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media (max-width:1000px){
  .player{grid-template-columns:minmax(140px,1fr) minmax(260px,2fr) auto;}
  .vol-wrap{display:none;}
}
@media (max-width:820px){
  .app{grid-template-columns:1fr;grid-template-areas:"main" "player";}
  .sidebar{display:none;}
  .hero h1{font-size:30px;}
}
@media (max-width:620px){
  .songlist-head{display:none;}
  .song{grid-template-columns:32px 1fr 34px;gap:12px;}
  .song .s-art{display:none;}
  .song .s-dur{display:none;}
  .progress{max-width:none;}
  .time{display:none;}
  .player{height:76px;grid-template-columns:1fr auto;}
  .center{flex-direction:row;gap:14px;}
  .progress{display:none;}
  .np-art{width:46px;height:46px;}
}
</style>
</head>
<body>

<div class="app">

  <!-- ================= SIDEBAR ================= -->
  <aside class="sidebar">
    <div class="brand">
      <span class="logo">
        <svg viewBox="0 0 24 24"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg>
      </span>
      SpotOn
    </div>

    <nav class="nav">
      <button class="nav-btn active" data-view="home">
        <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        Home
      </button>
      <button class="nav-btn" data-view="search">
        <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        Search
      </button>
    </nav>

    <div class="lib">
      <div class="lib-head">
        <svg viewBox="0 0 24 24"><path d="M4 6H2v14a2 2 0 0 0 2 2h14v-2H4V6zm16-4H8a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2zm-3 9l-5 3V8l5 3z"/></svg>
        Your Library
      </div>
      <div class="lib-list" id="libList"></div>
    </div>
  </aside>

  <!-- ================= MAIN ================= -->
  <main class="main" id="main">
    <header class="topbar">
      <button class="arrow-btn" id="backBtn" title="Back">
        <svg viewBox="0 0 24 24"><path d="M15.4 7.4 14 6l-6 6 6 6 1.4-1.4-4.6-4.6z"/></svg>
      </button>
      <button class="arrow-btn" id="fwdBtn" title="Forward">
        <svg viewBox="0 0 24 24"><path d="M8.6 16.6 10 18l6-6-6-6-1.4 1.4 4.6 4.6z"/></svg>
      </button>

      <div class="searchbox">
        <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        <input id="search" type="text" placeholder="What do you want to play?" autocomplete="off" spellcheck="false">
      </div>

      <div class="user-chip" title="Signed in">S</div>
    </header>

    <div id="content"></div>
  </main>

  <!-- ================= PLAYER ================= -->
  <footer class="player">
    <!-- Now playing -->
    <div class="np">
      <div class="np-art" id="npArt"></div>
      <div class="np-meta">
        <div class="np-title" id="npTitle">Nothing playing</div>
        <div class="np-artist" id="npArtist">Pick a song to start</div>
      </div>
      <button class="np-like" id="npLike" title="Save to Liked Songs">
        <svg viewBox="0 0 24 24" class="heart-outline"><path d="M16.5 3c-1.74 0-3.41.81-4.5 2.09C10.91 3.81 9.24 3 7.5 3 4.42 3 2 5.42 2 8.5c0 3.78 3.4 6.86 8.55 11.54L12 21.35l1.45-1.32C18.6 15.36 22 12.28 22 8.5 22 5.42 19.58 3 16.5 3zm-4.4 15.55l-.1.1-.1-.1C7.14 14.24 4 11.39 4 8.5 4 6.5 5.5 5 7.5 5c1.54 0 3.04.99 3.57 2.36h1.87C13.46 5.99 14.96 5 16.5 5c2 0 3.5 1.5 3.5 3.5 0 2.89-3.14 5.74-7.9 10.05z"/></svg>
        <svg viewBox="0 0 24 24" class="heart-filled"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
      </button>
    </div>

    <!-- Controls -->
    <div class="center">
      <div class="controls">
        <button class="ctrl" id="shuffleBtn" title="Shuffle">
          <svg viewBox="0 0 24 24"><path d="M10.59 9.17 5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
        </button>

        <button class="ctrl" id="prevBtn" title="Previous">

          <svg viewBox="0 0 24 24" id="playIcon"><path d="M8 5v14l11-7z"/></svg>

          <svg viewBox="0 0 24 24" id="repeatIcon"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>

        <svg viewBox="0 0 24 24" id="volIcon"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
      </button>

        <div class="bar-inner"><div class="fill" id="volFill"></div></div>
      </div>
    </div>
  </footer>
</div>

<div id="toast"></div>

<script>
"use strict";

/* ============================================================
   1. ICONS
   ============================================================ */
const ICON = {
  play:  '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>',
  pause: '<svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>',
  note:  '<svg viewBox="0 0 24 24"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg>',
  heart: '<svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>',
  heartO:'<svg viewBox="0 0 24 24"><path d="M16.5 3c-1.74 0-3.41.81-4.5 2.09C10.91 3.81 9.24 3 7.5 3 4.42 3 2 5.42 2 8.5c0 3.78 3.4 6.86 8.55 11.54L12 21.35l1.45-1.32C18.6 15.36 22 12.28 22 8.5 22 5.42 19.58 3 16.5 3zm-4.4 15.55l-.1.1-.1-.1C7.14 14.24 4 11.39 4 8.5 4 6.5 5.5 5 7.5 5c1.54 0 3.04.99 3.57 2.36h1.87C13.46 5.99 14.96 5 16.5 5c2 0 3.5 1.5 3.5 3.5 0 2.89-3.14 5.74-7.9 10.05z"/></svg>'
};

const REPEAT_ONE_PATH = "M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4zm-4-2V9h-1l-2 1v1h1.5v4H13z";

/* ============================================================
   2. PLAYLISTS — HAND-MADE, NOT AUTO-GENERATED
   ============================================================
   Edit this list yourself. Each playlist has:
     id          unique string (used in the URL-ish view state)
     name        shown in the sidebar + cards
     description short line under the name
     songs       array of references. Each reference is matched
                 against your library by, in order:
                   1. exact file name   e.g. "midnight-drive.mp3"
                   2. exact title       e.g. "Midnight Drive"
                 Case-insensitive. Refs that don't match anything
                 are silently skipped, so you can list songs you
                 haven't downloaded yet.
   ============================================================ */
const PLAYLISTS = [
  {
    id: "late-night",
    name: "Late Night Drive",
    description: "Moody synths for empty roads",
    songs: [
      "midnight-drive.mp3",
      "echo-chamber.mp3",
      "city-lights.mp3"
    ]
  },
  {
    id: "focus",
    name: "Focus",
    description: "Instrumentals to get things done",
    songs: [
      "Underwater Dreams",
      "Northern Sky",
      "Paper Planes"
    ]
  },
  {
    id: "feel-good",
    name: "Feel Good",
    description: "Sunny-side up",
    songs: [
      "Golden Hour",
      "Afterglow",
      "Wildfire",
      "Cassette Tape"
    ]
  }
];

/* ============================================================
   3. STATE
   ============================================================ */
const state = {
  songs: [],            // every song found in db/song/
  currentList: [],      // list currently rendered in #content
  queue: [],            // play context
  order: [],            // play order (indices into queue)
  pos: -1,              // position inside order
  playing: false,
  shuffle: false,
  repeat: "off",        // "off" | "all" | "one"
  liked: new Set(),     // liked song keys
  volume: 0.8,
  lastVolume: 0.8,
  muted: false,
  view: "home",
  currentPlaylistId: null,
  history: [],
  historyIndex: -1
};

const audio = new Audio();
audio.preload = "metadata";
audio.volume = state.volume;

/* ============================================================
   4. UTILITIES
   ============================================================ */
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];

const esc = s => String(s).replace(/[&<>"']/g, c => (
  { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
));

function hashStr(str) {
  let h = 0;
  for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) | 0;
  return Math.abs(h);
}

function coverStyle(song) {
  const h = hashStr(song.title + "|" + song.artist);
  const a = h % 360;
  const b = (a + 55 + ((h >> 4) % 130)) % 360;
  return `background:linear-gradient(135deg,hsl(${a} 62% 44%),hsl(${b} 68% 20%))`;
}

function fmtTime(sec) {
  if (!isFinite(sec) || sec < 0) return "0:00";
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return m + ":" + String(s).padStart(2, "0");
}

function songKey(song) { return song.title + "::" + song.artist; }

function songUrl(song) {
  let f = String(song.file || "");
  f = f.replace(/^\.?\//, "").replace(/^db\/song\//i, "");
  return "db/song/" + f.split("/").map(encodeURIComponent).join("/");
}

function prettifyName(filename) {
  return decodeURIComponent(filename)
    .replace(/\.[^.]+$/, "")
    .replace(/[_-]+/g, " ")
    .replace(/\s+/g, " ")
    .trim()
    .replace(/\b\w/g, c => c.toUpperCase());
}

function shuffleArray(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

let toastTimer = null;
function toast(msg) {
  const el = $("#toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 2600);
}

const plural = (n, word) => n + " " + word + (n === 1 ? "" : "s");

/* ============================================================
   5. LOADING SONGS FROM db/song/
   ============================================================ */
async function loadSongs() {
  // (a) Optional JSON manifest at db/song/songs.json
  try {
    const res = await fetch("db/song/songs.json", { cache: "no-store" });
    if (res.ok) {
      const data = await res.json();
      if (Array.isArray(data) && data.length) {
        return data.map(normalizeSong).filter(Boolean);
      }
    }
  } catch (e) { /* ignore */ }

  // (b) Auto-generated directory listing (works when the folder is browsable)
  try {
    const res = await fetch("db/song/", { cache: "no-store" });
    if (res.ok) {
      const html = await res.text();
      const doc = new DOMParser().parseFromString(html, "text/html");
      const files = [...doc.querySelectorAll("a")]
        .map(a => a.getAttribute("href"))
        .filter(h => h && /\.(mp3|m4a|ogg|wav|flac|aac)$/i.test(h))
        .map(h => decodeURIComponent(h.split("/").pop().split("?")[0]));
      if (files.length) {
        return files.map(f => ({ title: prettifyName(f), artist: "Unknown Artist", file: f }));
      }
    }
  } catch (e) { /* ignore */ }

  // (c) Nothing found — library is empty. No fake songs.
  return [];
}

function normalizeSong(raw) {
  if (typeof raw === "string") {
    return { title: prettifyName(raw), artist: "Unknown Artist", file: raw };
  }
  if (!raw || typeof raw !== "object") return null;
  const file = raw.file || raw.src || raw.url || "";
  if (!file) return null;
  return {
    title: raw.title || prettifyName(file),
    artist: raw.artist || raw.author || "Unknown Artist",
    album: raw.album || "",
    file,
    duration: typeof raw.duration === "number" ? raw.duration : null
  };
}

/* Lazily read metadata so we can show durations */
async function prefetchDurations() {
  for (const song of state.songs) {
    if (song.duration) continue;
    try {
      song.duration = await readDuration(songUrl(song));
      updateDurationUI(song);
    } catch (e) { /* file missing — just skip */ }
  }
}

function readDuration(src) {
  return new Promise((resolve, reject) => {
    const a = new Audio();
    a.preload = "metadata";
    const done = ok => {
      a.removeEventListener("loadedmetadata", onLoad);
      a.removeEventListener("error", onErr);
      a.src = "";
      ok ? resolve(a.duration) : reject(new Error("load error"));
    };
    const onLoad = () => done(true);
    const onErr  = () => done(false);
    a.addEventListener("loadedmetadata", onLoad);
    a.addEventListener("error", onErr);
    a.src = src;
    setTimeout(() => done(false), 8000);
  });
}

function updateDurationUI(song) {
  const i = state.currentList.indexOf(song);
  if (i < 0) return;
  const el = document.querySelector(`#content .song[data-idx="${i}"] .s-dur`);
  if (el && song.duration) el.textContent = fmtTime(song.duration);
}

/* ============================================================
   6. PLAYLIST RESOLUTION  (manual playlists -> real songs)
   ============================================================ */
function matchSong(ref) {
  const q = String(ref).trim().toLowerCase();
  if (!q) return null;
  const base = q.replace(/^.*\//, "");
  const baseNoExt = base.replace(/\.[^.]+$/, "");

  return state.songs.find(s => {
    const file = s.file.toLowerCase();
    const fileBase = file.replace(/^.*\//, "");
    const fileNoExt = fileBase.replace(/\.[^.]+$/, "");
    return file === q
        || fileBase === base
        || fileBase === baseNoExt
        || fileNoExt === baseNoExt
        || s.title.toLowerCase() === q;
  }) || null;
}

function resolvePlaylist(pl) {
  if (!pl) return [];
  const out = [];
  const seen = new Set();
  for (const ref of (pl.songs || [])) {
    const s = matchSong(ref);
    if (!s) continue;
    const k = songKey(s);
    if (seen.has(k)) continue;
    seen.add(k);
    out.push(s);
  }
  return out;
}

const getPlaylist = id => PLAYLISTS.find(p => p.id === id) || null;

/* ============================================================
   7. PLAYBACK ENGINE
   ============================================================ */
const currentSong = () =>
  state.order.length && state.pos >= 0 && state.pos < state.order.length
    ? state.queue[state.order[state.pos]]
    : null;

function buildOrder(startIdx) {
  const n = state.queue.length;
  if (state.shuffle) {
    const rest = [...Array(n).keys()].filter(i => i !== startIdx);
    shuffleArray(rest);
    state.order = [startIdx, ...rest];
    state.pos = 0;
  } else {
    state.order = [...Array(n).keys()];
    state.pos = startIdx;
  }
}

/** Play a song inside a given context list */
function playSong(song, context) {
  const list = (context && context.length ? context : state.songs).slice();
  let idx = list.indexOf(song);
  if (idx < 0) { list.unshift(song); idx = 0; }

  state.queue = list;
  buildOrder(idx);
  loadCurrent(true);
}

function loadCurrent(autoplay) {
  const song = currentSong();
  if (!song) return;

  audio.src = songUrl(song);

  updateNowPlaying();
  renderHighlight();

  if (autoplay) {
    audio.play().catch(() => {
      setPlaying(false);
      toast('Could not play "' + song.title + '". Check that the file exists in db/song/');
    });
  }
}

function setPlaying(v) {
  state.playing = v;
  updatePlayIcon();
  renderHighlight();
  updateMediaSession();
}

function togglePlay() {
  const song = currentSong();
  if (!song) {
    if (state.songs.length) playSong(state.songs[0], state.songs);
    else toast("Your library is empty — add files to db/song/");
    return;
  }
  if (audio.paused) {
    audio.play().catch(() => toast("Playback failed."));
  } else {
    audio.pause();
  }
}

function next(auto) {
  if (!state.order.length) return;

  // Repeat one only kicks in on natural track end
  if (auto && state.repeat === "one") {
    audio.currentTime = 0;
    audio.play().catch(() => {});
    return;
  }

  if (state.pos < state.order.length - 1) {
    state.pos++;
  } else if (state.repeat === "all") {
    buildOrder(state.order[0]);     // rebuild (reshuffle if shuffle is on)
    if (state.shuffle) state.pos = 0;
  } else {
    // End of queue
    audio.pause();
    audio.currentTime = 0;
    setPlaying(false);
    return;
  }
  loadCurrent(true);
}

function prev() {
  if (!state.order.length) return;
  if (audio.currentTime > 3) {
    audio.currentTime = 0;
    return;
  }
  if (state.pos > 0) state.pos--;
  else if (state.repeat === "all") state.pos = state.order.length - 1;
  else audio.currentTime = 0;
  loadCurrent(true);
}

/* ============================================================
   8. PLAYER UI
   ============================================================ */
function updateNowPlaying() {
  const song = currentSong();
  const art = $("#npArt");

  if (!song) {
    $("#npTitle").textContent = "Nothing playing";
    $("#npArtist").textContent = "Pick a song to start";
    art.style.background = "#282828";
    art.innerHTML = ICON.note;
    $("#npLike").classList.remove("on");
    $("#npLike").innerHTML = ICON.heartO;
    document.title = "SpotOn — Web Player";
    return;
  }

  art.style.cssText = coverStyle(song);
  art.innerHTML = ICON.note;
  $("#npTitle").textContent = song.title;
  $("#npArtist").textContent = song.artist;

  const liked = state.liked.has(songKey(song));
  $("#npLike").classList.toggle("on", liked);
  $("#npLike").innerHTML = liked ? ICON.heart : ICON.heartO;

  document.title = song.title + " • " + song.artist + " — SpotOn";
  updateMediaSession();
}

function updatePlayIcon() {
  $("#playIcon").innerHTML = state.playing
    ? '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>'
    : '<path d="M8 5v14l11-7z"/>';
}

function renderHighlight() {
  const song = currentSong();
  $$("#content .song").forEach(row => {
    const i = Number(row.dataset.idx);
    const s = state.currentList[i];
    const isCur = s && song && s === song;
    row.classList.toggle("playing", isCur);
    row.classList.toggle("paused", isCur && !state.playing);
  });
}

/* Progress + volume bars ------------------------------------- */
function updateProgress() {
  const d = audio.duration || 0;
  const c = audio.currentTime || 0;
  const pct = d ? (c / d) * 100 : 0;
  $("#seekFill").style.width = pct + "%";
  $("#curTime").textContent = fmtTime(c);
  $("#durTime").textContent = d ? fmtTime(d) : "0:00";
}

function updateVolumeUI() {
  const v = state.muted ? 0 : state.volume;
  $("#volFill").style.width = (v * 100) + "%";
  const icon = $("#volIcon");
  if (v === 0) {
    icon.innerHTML = '<path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3 3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4 9.91 6.09 12 8.18V4z"/>';
  } else if (v < 0.5) {
    icon.innerHTML = '<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/>';
  } else {
    icon.innerHTML = '<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>';
  }
}

/* Drag helper for bars --------------------------------------- */
function makeBarDraggable(barEl, onRatio, onCommit) {
  let dragging = false;

  const ratioFromEvent = e => {
    const r = barEl.getBoundingClientRect();
    return Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
  };

  const move = e => {
    if (!dragging) return;
    onRatio(ratioFromEvent(e), false);
  };
  const up = e => {
    if (!dragging) return;
    dragging = false;
    document.removeEventListener("pointermove", move);
    document.removeEventListener("pointerup", up);
    if (onCommit) onCommit(ratioFromEvent(e));
  };

  barEl.addEventListener("pointerdown", e => {
    e.preventDefault();
    dragging = true;
    onRatio(ratioFromEvent(e), true);
    document.addEventListener("pointermove", move);
    document.addEventListener("pointerup", up);
  });
}

/* ============================================================
   9. RENDERING
   ============================================================ */
const content = $("#content");

const EMPTY_LIBRARY_HTML = `
  <div class="empty">
    <h3>No songs found</h3>
    <p>Drop audio files into <code>db/song/</code> and reload the page.<br>
       Playlists in the sidebar are matched against whatever is in that folder.</p>
  </div>`;

function rowHTML(song, i) {
  const liked = state.liked.has(songKey(song));
  return `
    <div class="song" data-idx="${i}">
      <div class="s-num">
        <span class="num">${i + 1}</span>
        <span class="ic-play">${ICON.play}</span>
        <span class="ic-pause">${ICON.pause}</span>
        <span class="eq"><i></i><i></i><i></i><i></i></span>
      </div>
      <div class="s-art" style="${coverStyle(song)}">${ICON.note}</div>
      <div class="s-meta">
        <div class="s-title">${esc(song.title)}</div>
        <div class="s-artist">${esc(song.artist)}</div>
      </div>
      <div class="s-dur">${song.duration ? fmtTime(song.duration) : "--:--"}</div>
      <button class="s-like ${liked ? "on" : ""}" data-like="${i}" title="Like">
        ${liked ? ICON.heart : ICON.heartO}
      </button>
    </div>`;
}

function listHTML(list, { head = true, empty = EMPTY_LIBRARY_HTML } = {}) {
  state.currentList = list;
  if (!list.length) return empty;
  return `
    ${head ? `<div class="songlist-head">
      <span>#</span><span></span><span>Title</span>
      <span class="h-dur">Duration</span><span></span>
    </div>` : ""}
    <div class="songlist">${list.map(rowHTML).join("")}</div>`;
}

/* Playlist card (used on Home + Search) ---------------------- */
function playlistCardHTML(pl) {
  const list = resolvePlaylist(pl);
  const seed = list[0] || { title: pl.name, artist: pl.name };
  return `
    <div class="card" data-playlist="${pl.id}">
      <div class="card-art" style="${coverStyle(seed)}">${ICON.note}</div>
      <div class="card-title">${esc(pl.name)}</div>
      <div class="card-sub">${esc(pl.description || "Playlist")} • ${plural(list.length, "song")}</div>
      <button class="card-play" data-playlistplay="${pl.id}" title="Play">${ICON.play}</button>
    </div>`;
}

/* ---------- Views ---------- */
function renderHome() {
  state.view = "home";
  state.currentList = state.songs;

  const hour = new Date().getHours();
  const greet = hour < 12 ? "Good morning" : hour < 18 ? "Good afternoon" : "Good evening";

  if (!state.songs.length) {
    content.innerHTML = `
      <div class="hero">
        <h1>${greet}</h1>
        <p>Your library is empty</p>
      </div>
      <section class="section">
        ${EMPTY_LIBRARY_HTML}
      </section>`;
    return;
  }

  content.innerHTML = `
    <div class="hero">
      <h1>${greet}</h1>
      <p>${plural(state.songs.length, "track")} in your library</p>
    </div>

    <section class="section">
      <div class="section-head"><h2>Your playlists</h2></div>
      <div class="cards">
        ${PLAYLISTS.map(playlistCardHTML).join("")}
      </div>
    </section>

    <section class="section">
      <div class="section-head">
        <h2>All songs</h2>
        <button class="see-all" data-playall="1">Play all</button>
      </div>
      ${listHTML(state.songs)}
    </section>`;

  renderHighlight();
}

function renderPlaylist(id) {
  const pl = getPlaylist(id);
  if (!pl) { renderHome(); return; }

  const list = resolvePlaylist(pl);

  state.view = "playlist";
  state.currentPlaylistId = pl.id;
  state.currentList = list;

  content.innerHTML = `
    <div class="hero" style="background:linear-gradient(180deg,rgba(29,185,84,.25),transparent)">
      <h1>${esc(pl.name)}</h1>
      <p>${esc(pl.description || "Playlist")} • ${plural(list.length, "song")}</p>
    </div>
    <section class="section">
      ${listHTML(list, {
        empty: `<div class="empty">
                  <h3>This playlist is empty</h3>
                  <p>None of the songs listed in <code>${esc(pl.id)}</code> were found in <code>db/song/</code>.<br>
                     Edit the <code>PLAYLISTS</code> list in the script to point at files you actually have.</p>
                </div>`
      })}
    </section>`;

  renderHighlight();
}

function renderSearchView() {
  state.view = "search";
  state.currentPlaylistId = null;
  state.currentList = state.songs;

  if (!state.songs.length) {
    content.innerHTML = `
      <div class="hero">
        <h1>Search</h1>
        <p>Find songs, artists and albums</p>
      </div>
      <section class="section">${EMPTY_LIBRARY_HTML}</section>`;
    return;
  }

  content.innerHTML = `
    <div class="hero">
      <h1>Search</h1>
      <p>Find songs, artists and albums</p>
    </div>
    <section class="section">
      <div class="section-head"><h2>Your playlists</h2></div>
      <div class="cards">
        ${PLAYLISTS.map(playlistCardHTML).join("")}
      </div>
    </section>`;
}

function renderResults(query) {
  state.view = "search";
  state.currentPlaylistId = null;

  const q = query.trim().toLowerCase();
  const results = state.songs.filter(s =>
    s.title.toLowerCase().includes(q) ||
    s.artist.toLowerCase().includes(q) ||
    (s.album || "").toLowerCase().includes(q)
  );

  content.innerHTML = `
    <div class="hero" style="padding-top:34px;margin-top:0;background:none">
      <h1 style="font-size:26px">Results for "${esc(query)}"</h1>
      <p>${plural(results.length, "song")}</p>
    </div>
    <section class="section">
      ${listHTML(results, {
        empty: `<div class="empty"><h3>No matches</h3><p>Nothing in your library matches that search.</p></div>`
      })}
    </section>`;

  renderHighlight();
}

function renderLiked() {
  state.view = "liked";
  state.currentPlaylistId = null;
  const list = state.songs.filter(s => state.liked.has(songKey(s)));
  state.currentList = list;

  content.innerHTML = `
    <div class="hero" style="background:linear-gradient(180deg,rgba(80,20,220,.35),transparent)">
      <h1>Liked Songs</h1>
      <p>${plural(list.length, "song")}</p>
    </div>
    <section class="section">
      ${list.length
        ? listHTML(list, { head: false })
        : `<div class="empty">
             <h3>No liked songs yet</h3>
             <p>Tap the heart on any track to save it here.</p>
           </div>`}
    </section>`;

  renderHighlight();
}

function renderAllSongs() {
  state.view = "all";
  state.currentPlaylistId = null;
  state.currentList = state.songs;

  content.innerHTML = `
    <div class="hero">
      <h1>All Songs</h1>
      <p>${plural(state.songs.length, "track")}</p>
    </div>
    <section class="section">
      ${listHTML(state.songs, {
        empty: EMPTY_LIBRARY_HTML
      })}
    </section>`;

  renderHighlight();
}

/* ---------- Sidebar library ---------- */
function renderLibrary() {
  const wrap = $("#libList");
  const likedCount = state.liked.size;

  const likedActive = state.view === "liked";
  const allActive = state.view === "all";

  wrap.innerHTML = `
    <button class="lib-item ${likedActive ? "active" : ""}" data-lib="liked">
      <div class="lib-art liked">${ICON.heart}</div>
      <div class="lib-meta">
        <div class="lib-title">Liked Songs</div>
        <div class="lib-sub">Playlist • ${plural(likedCount, "song")}</div>
      </div>
    </button>

    <button class="lib-item ${allActive ? "active" : ""}" data-lib="all">
      <div class="lib-art" style="background:linear-gradient(135deg,#1db954,#0b5c2b);color:#000">${ICON.note}</div>
      <div class="lib-meta">
        <div class="lib-title">All Songs</div>
        <div class="lib-sub">Library • ${plural(state.songs.length, "song")}</div>
      </div>
    </button>

    ${PLAYLISTS.map(pl => {
      const list = resolvePlaylist(pl);
      const seed = list[0] || { title: pl.name, artist: pl.name };
      const active = state.view === "playlist" && state.currentPlaylistId === pl.id;
      return `
        <button class="lib-item ${active ? "active" : ""}" data-playlist="${pl.id}">
          <div class="lib-art" style="${coverStyle(seed)}">${ICON.note}</div>
          <div class="lib-meta">
            <div class="lib-title">${esc(pl.name)}</div>
            <div class="lib-sub">Playlist • ${plural(list.length, "song")}</div>
          </div>
        </button>`;
    }).join("")}

    ${!state.songs.length ? `
      <div class="lib-empty">
        No songs found in <b>db/song/</b>. Add audio files, then reload.
      </div>` : ""}`;
}

/* ============================================================
   10. LIKES
   ============================================================ */
function toggleLike(song) {
  if (!song) return;
  const key = songKey(song);
  if (state.liked.has(key)) state.liked.delete(key);
  else state.liked.add(key);

  saveLikes();

  // Update sidebar counters & any visible heart
  renderLibrary();
  updateNowPlaying();

  const i = state.currentList.indexOf(song);
  if (i >= 0) {
    const btn = document.querySelector(`#content .song[data-idx="${i}"] .s-like`);
    if (btn) {
      const on = state.liked.has(key);
      btn.classList.toggle("on", on);
      btn.innerHTML = on ? ICON.heart : ICON.heartO;
    }
  }
}

function saveLikes() {
  try { localStorage.setItem("spoton.likes", JSON.stringify([...state.liked])); } catch (e) {}
}
function loadLikes() {
  try {
    const raw = localStorage.getItem("spoton.likes");
    if (raw) JSON.parse(raw).forEach(k => state.liked.add(k));
  } catch (e) {}
}

/* ============================================================
   11. MEDIA SESSION
   ============================================================ */
function updateMediaSession() {
  if (!("mediaSession" in navigator)) return;
  const song = currentSong();
  if (!song) return;
  try {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: song.title,
      artist: song.artist,
      album: song.album || "SpotOn"
    });
    navigator.mediaSession.playbackState = state.playing ? "playing" : "paused";
  } catch (e) {}
}

/* ============================================================
   12. VIEW HISTORY
   ============================================================ */
function currentViewKey() {
  return state.view === "playlist"
    ? "playlist:" + state.currentPlaylistId
    : state.view;
}

function pushHistory(key) {
  if (state.history[state.historyIndex] === key) return;
  state.history = state.history.slice(0, state.historyIndex + 1);
  state.history.push(key);
  state.historyIndex = state.history.length - 1;
}

function restoreView(key) {
  if (!key) return;
  if (key.startsWith("playlist:")) renderPlaylist(key.slice(9));
  else if (key === "home") renderHome();
  else if (key === "search") renderSearchView();
  else if (key === "liked") renderLiked();
  else if (key === "all") renderAllSongs();
  else renderHome();
  renderLibrary();
}

function goHistory(delta) {
  const next = state.historyIndex + delta;
  if (next < 0 || next >= state.history.length) return;
  state.historyIndex = next;
  restoreView(state.history[next]);
}

/* ============================================================
   13. EVENT WIRING
   ============================================================ */

/* --- audio events --- */
audio.addEventListener("play",  () => setPlaying(true));
audio.addEventListener("pause", () => setPlaying(false));
audio.addEventListener("timeupdate", updateProgress);
audio.addEventListener("loadedmetadata", () => {
  updateProgress();
  const song = currentSong();
  if (song && !song.duration) {
    song.duration = audio.duration;
    updateDurationUI(song);
  }
});
audio.addEventListener("ended", () => next(true));
audio.addEventListener("error", () => {
  const song = currentSong();
  if (song) toast('Cannot load "' + song.title + '" from db/song/');
  setPlaying(false);
});

/* --- play / pause / next / prev --- */
$("#playBtn").addEventListener("click", togglePlay);
$("#nextBtn").addEventListener("click", () => next(false));
$("#prevBtn").addEventListener("click", prev);

/* --- shuffle --- */
$("#shuffleBtn").addEventListener("click", () => {
  state.shuffle = !state.shuffle;
  $("#shuffleBtn").classList.toggle("on", state.shuffle);

  const song = currentSong();
  if (song && state.queue.length) {
    const idx = state.queue.indexOf(song);
    buildOrder(idx < 0 ? 0 : idx);
    if (!state.shuffle) {
      // restore natural position
      state.pos = idx < 0 ? 0 : idx;
    }
  }
  toast(state.shuffle ? "Shuffle on" : "Shuffle off");
});

/* --- repeat --- */
$("#repeatBtn").addEventListener("click", () => {
  state.repeat = state.repeat === "off" ? "all" : state.repeat === "all" ? "one" : "off";
  const btn = $("#repeatBtn");
  const icon = $("#repeatIcon");

  btn.classList.toggle("on", state.repeat !== "off");
  icon.innerHTML = state.repeat === "one"
    ? `<path d="${REPEAT_ONE_PATH}"/>`
    : '<path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/>';

  toast(state.repeat === "off" ? "Repeat off"
      : state.repeat === "all" ? "Repeat all" : "Repeat one");
});

/* --- mute --- */
$("#muteBtn").addEventListener("click", () => {
  if (state.muted || state.volume === 0) {
    state.muted = false;
    state.volume = state.lastVolume || 0.8;
  } else {
    state.lastVolume = state.volume;
    state.muted = true;
  }
  audio.volume = state.muted ? 0 : state.volume;
  updateVolumeUI();
});

/* --- seek bar --- */
makeBarDraggable(
  $("#seekBar"),
  ratio => {
    $("#seekFill").style.width = (ratio * 100) + "%";
    $("#curTime").textContent = fmtTime(ratio * (audio.duration || 0));
  },
  ratio => {
    if (isFinite(audio.duration)) {
      audio.currentTime = ratio * audio.duration;
    }
  }
);

/* --- volume bar --- */
makeBarDraggable(
  $("#volBar"),
  ratio => {
    state.volume = ratio;
    state.muted = ratio === 0;
    audio.volume = ratio;
    $("#volFill").style.width = (ratio * 100) + "%";
  },
  () => updateVolumeUI()
);

/* --- now-playing heart --- */
$("#npLike").addEventListener("click", () => toggleLike(currentSong()));

/* --- sidebar nav --- */
$$(".nav-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    $$(".nav-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    const v = btn.dataset.view;
    if (v === "home") renderHome();
    else if (v === "search") { renderSearchView(); $("#search").focus(); }
    renderLibrary();
    pushHistory(currentViewKey());
  });
});

/* --- sidebar library (delegated) --- */
$("#libList").addEventListener("click", e => {
  const item = e.target.closest("[data-lib],[data-playlist]");
  if (!item) return;

  if (item.dataset.lib === "liked") renderLiked();
  else if (item.dataset.lib === "all") renderAllSongs();
  else if (item.dataset.playlist) renderPlaylist(item.dataset.playlist);

  renderLibrary();
  pushHistory(currentViewKey());
});

/* --- main content (delegated) --- */
content.addEventListener("click", e => {
  /* like button */
  const likeBtn = e.target.closest("[data-like]");
  if (likeBtn) {
    e.stopPropagation();
    const i = Number(likeBtn.dataset.like);
    toggleLike(state.currentList[i]);
    return;
  }

  /* playlist card play button */
  const plPlay = e.target.closest("[data-playlistplay]");
  if (plPlay) {
    e.stopPropagation();
    const pl = getPlaylist(plPlay.dataset.playlistplay);
    const list = resolvePlaylist(pl);
    if (list.length) playSong(list[0], list);
    else toast('"' + (pl ? pl.name : "Playlist") + '" has no songs in your library');
    return;
  }

  /* playlist card */
  const plCard = e.target.closest("[data-playlist]");
  if (plCard) {
    renderPlaylist(plCard.dataset.playlist);
    renderLibrary();
    pushHistory(currentViewKey());
    return;
  }

  /* play all */
  const playAll = e.target.closest("[data-playall]");
  if (playAll) {
    if (state.songs.length) playSong(state.songs[0], state.songs);
    return;
  }

  /* song row */
  const row = e.target.closest(".song");
  if (row) {
    const i = Number(row.dataset.idx);
    const song = state.currentList[i];
    if (!song) return;

    if (song === currentSong()) togglePlay();
    else playSong(song, state.currentList);

    renderHighlight();
  }
});

/* --- search --- */
const searchInput = $("#search");
let searchTimer = null;

searchInput.addEventListener("input", () => {
  clearTimeout(searchTimer);
  const q = searchInput.value;

  searchTimer = setTimeout(() => {
    if (!q.trim()) {
      renderSearchView();
      renderLibrary();
    } else {
      renderResults(q);
      $$(".nav-btn").forEach(b => b.classList.toggle("active", b.dataset.view === "search"));
      pushHistory("search");
    }
  }, 130);
});

searchInput.addEventListener("keydown", e => {
  if (e.key === "Escape") {
    searchInput.value = "";
    searchInput.blur();
    renderHome();
    renderLibrary();
    pushHistory("home");
  }
});

/* --- back / forward --- */
$("#backBtn").addEventListener("click", () => goHistory(-1));
$("#fwdBtn").addEventListener("click",  () => goHistory(1));

/* --- keyboard shortcuts --- */
document.addEventListener("keydown", e => {
  const tag = (e.target.tagName || "").toLowerCase();
  if (tag === "input" || tag === "textarea") return;

  switch (e.key) {
    case " ":
      e.preventDefault();
      togglePlay();
      break;
    case "ArrowRight":
      if (e.shiftKey) next(false);
      else if (isFinite(audio.duration)) audio.currentTime = Math.min(audio.duration, audio.currentTime + 5);
      break;
    case "ArrowLeft":
      if (e.shiftKey) prev();
      else audio.currentTime = Math.max(0, audio.currentTime - 5);
      break;
    case "ArrowUp":
      e.preventDefault();
      state.muted = false;
      state.volume = Math.min(1, state.volume + 0.05);
      audio.volume = state.volume;
      updateVolumeUI();
      break;
    case "ArrowDown":
      e.preventDefault();
      state.volume = Math.max(0, state.volume - 0.05);
      audio.volume = state.volume;
      updateVolumeUI();
      break;
    case "m":
      $("#muteBtn").click();
      break;
    case "s":
      $("#shuffleBtn").click();
      break;
    case "r":
      $("#repeatBtn").click();
      break;
    case "/":
      e.preventDefault();
      searchInput.focus();
      break;
  }
});

/* ============================================================
   14. INIT
   ============================================================ */
async function init() {
  loadLikes();

  state.songs = await loadSongs();
  state.currentList = state.songs;

  renderHome();
  renderLibrary();
  updateVolumeUI();
  updatePlayIcon();
  updateNowPlaying();
  updateProgress();

  // Seed history
  state.history = ["home"];
  state.historyIndex = 0;

  // Fetch durations in the background (metadata only)
  prefetchDurations();

  if (!state.songs.length) {
    toast("No songs found — add audio files to db/song/");
  }
}

init();
</script>
</body>
</html>
